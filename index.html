<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STRNG Training</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --card:#111113;
  --card-sub:#18181b;
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.16);
  --text:#ffffff;
  --mut:#a1a1aa;
  --dim:#71717a;
  --em:#30d158;
  --red:#ff453a;
  --red-dim:rgba(255,69,58,0.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:14px;line-height:1.45}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* Fejléc */
.top{
  position:sticky;top:0;z-index:30;
  background:rgba(0,0,0,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:20px;font-weight:900;letter-spacing:-0.03em}
.brand span{font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--mut);border-left:1px solid var(--line);padding-left:8px}
.pill{font-size:11px;font-weight:800;color:#fff;background:var(--card-sub);border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px}

/* Elrendezés */
.wrap{max-width:540px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Tipográfia */
.h{font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--mut)}
.h.em{color:var(--em)}
h2{font-size:19px;font-weight:800}h3{font-size:16px;font-weight:800}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:10.5px}
.mono{font-family:ui-monospace,Menlo,monospace}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card-sub);color:var(--mut);border-radius:999px;padding:4px 9px;font-size:10px;font-weight:800;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* Gombok és mezők */
.btn{width:100%;border:1px solid var(--line);background:var(--card-sub);border-radius:14px;padding:13px 16px;font-weight:800;font-size:12px;text-transform:uppercase;text-align:center}
.btn:active{transform:scale(0.97)}
.btn.pri{background:#fff;color:#000;border-color:#fff;font-weight:900}
.btn.white{background:#fff;color:#000;border-color:#fff;font-weight:900}
.btn.sm{width:auto;padding:6px 12px;font-size:11px;border-radius:10px}
.btn.danger{color:var(--red);border-color:rgba(255,69,58,0.2);background:var(--red-dim)}
.field{width:100%;background:var(--card-sub);border:1px solid var(--line);border-radius:14px;padding:12px;color:#fff;font:inherit;font-size:15px;outline:none}
.field:focus{border-color:var(--line-strong)}
textarea.field{resize:vertical;min-height:68px}
.time{text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:800}
.lbl{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--dim);margin-bottom:4px}

/* Dobozok */
.notice{border:1px solid var(--line);background:rgba(255,255,255,0.03);border-radius:16px;padding:14px;display:grid;gap:6px}
.notice h4{font-size:12.5px;font-weight:800;color:#fff}
.notice p{font-size:12px;color:#d4d4d8}

/* Naptársáv */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{min-width:58px;padding:8px 6px;border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:center;flex:0 0 auto}
.day small{display:block;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--dim)}
.day strong{display:block;font-size:16px;font-weight:900}
.day em{display:block;font-style:normal;font-size:8px;font-weight:900;color:var(--dim)}
.day.on{background:#fff;border-color:#fff;color:#000}
.day.on small,.day.on em{color:#000}

/* Elemek & Timer */
.setrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}
.setrow:last-child{border:0}
.item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.item:last-child{border:0}
.item i{font-style:normal;font-weight:900;color:#fff}
.timerbox{border:1px solid var(--line-strong);background:#070709;border-radius:18px;padding:16px;display:grid;gap:12px}
.timerdisplay{font:900 48px/1 ui-monospace,Menlo,monospace;text-align:center}
.movement-check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.movement-check:last-child{border-bottom:0}
.movement-check input{accent-color:#fff;width:18px;height:18px;margin:0}

/* Alsó sáv */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(10,10,12,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
nav button{border-radius:12px;padding:6px 2px;color:var(--dim);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:18px;line-height:1}
nav button.on{color:#fff;background:rgba(255,255,255,0.08)}

/* Modal & Toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.panel{max-width:500px;margin:0 auto;background:var(--card);border:1px solid var(--line-strong);border-radius:22px;padding:18px;display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(85px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#fff;color:#000;padding:9px 18px;border-radius:999px;font-size:12px;font-weight:800;text-align:center}
.toast.err{background:var(--red);color:#fff}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>STRNG</b><span id="title">Napi edzés</span></div>
  <div class="pill" id="badge">1. CIKLUS</div>
</header>

<main id="view" class="wrap"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

function liveTime(raw){
  const idx = raw.search(/\D/), all = raw.replace(/\D/g, '').slice(0, 4);
  if (idx >= 0) {
    const m = raw.slice(0, idx).replace(/\D/g, ''), s = raw.slice(idx).replace(/\D/g, '');
    if (m.length >= 1 && m.length <= 2 && s.length <= 2) return m + ':' + s;
  }
  if (all.length <= 2) return all;
  if (all.length === 3) return all[0] + ':' + all.slice(1);
  return all.slice(0, 2) + ':' + all.slice(2);
}
function normalizeTime(raw){
  raw = String(raw || '').trim(); if (!raw) return '';
  const idx = raw.search(/\D/); let m, s;
  if (idx >= 0) { m = raw.slice(0, idx).replace(/\\D/g, ''); s = raw.slice(idx).replace(/\\D/g, ''); }
  else { const d = raw.slice(0, 4); if (d.length <= 2) { m = d; s = ''; } else if (d.length === 3) { m = d[0]; s = d.slice(1); } else { m = d.slice(0, 2); s = d.slice(2); } }
  return m === '' ? raw : pad(+m) + ':' + pad(+(s || 0));
}

const baseState = () => ({
  programStart: today(),
  tm: { sq: 120, bp: 90, dl: 150, ohp: 60, pc: 80 },
  runTimes: { t2: '08:30', t5: '24:00' },
  dailyWods: {},
  logs: [],
  cycleApplied: 1,
  metconModes: {}
});

function sanitize(s){
  const b = baseState();
  if(!s || typeof s !== 'object') return b;
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(s.programStart || ''))) b.programStart = s.programStart;
  for(const l of LIFTS){
    const n = Number(s.tm?.[l.key]);
    if(Number.isFinite(n) && n > 0) b.tm[l.key] = round25(n);
  }
  const r = s.runTimes || {};
  if(r.t2) b.runTimes.t2 = r.t2;
  if(r.t5) b.runTimes.t5 = r.t5;
  if(s.dailyWods && typeof s.dailyWods === 'object') b.dailyWods = s.dailyWods;
  if(s.metconModes && typeof s.metconModes === 'object') b.metconModes = s.metconModes;
  if(Array.isArray(s.logs)) b.logs = s.logs.filter(x => x && x.id && x.date);
  b.cycleApplied = Number.isInteger(s.cycleApplied) ? s.cycleApplied : 1;
  return b;
}

function load(){
  try {
    const v = localStorage.getItem(KEY);
    if(v) return sanitize(JSON.parse(v));
  } catch(e){}
  return baseState();
}

/* HINSHAW TEMPÓSZÁMÍTÁS */
function getHinshawPaces(){
  const s5 = toSec(state.runTimes.t5) || 1440;
  const s2 = toSec(state.runTimes.t2) || Math.round(s5 * 0.38);
  const p5k = s5 / 5.0;
  const p2k = s2 / 2.0;
  const p_speed = p2k - 10;
  const p_tempo = p5k + 18;
  const p_easy = p5k + 75;
  const p_recovery = p5k + 105;

  return {
    p5k: fmtPace(p5k),
    p2k: fmtPace(p2k),
    speed: fmtPace(p_speed),
    tempo: fmtPace(p_tempo),
    easy: fmtPace(p_easy),
    recovery: fmtPace(p_recovery)
  };
}

function applyHinshawPaces(text){
  const P = getHinshawPaces();
  return text
    .replace(/@5k/g, `<span class="mono ok">@5k (${P.p5k}/km)</span>`)
    .replace(/@speed/g, `<span class="mono" style="color:#fff;font-weight:800">@Speed (${P.speed}/km)</span>`)
    .replace(/@tempo/g, `<span class="mono" style="color:#fff;font-weight:800">@Tempo (${P.tempo}/km)</span>`)
    .replace(/@easy/g, `<span class="mono" style="color:#d4d4d8;font-weight:700">@Easy (${P.easy}/km)</span>`)
    .replace(/@recovery/g, `<span class="mono dim">@Recovery (${P.recovery}/km)</span>`);
}

/* 5 NAPOS MOTOR */
const dayIndex = date => {
  const[y, m, d] = date.split('-').map(Number), [a, b, c] = state.programStart.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(a, b - 1, c)) / 864e5);
};

function planFor(date){
  const i = dayIndex(date);
  if (i < 0) return { kind: 'before' };
  const dayInWeek = i % 5;
  const week = Math.floor((i % 20) / 5) + 1;
  const cycle = Math.floor(i / 20) + 1;
  const lift = ROT[dayInWeek];
  return {
    kind: 'strength',
    lift,
    dayInWeek: dayInWeek + 1,
    week,
    cycle,
    isDeload: week === 4
  };
}

const cycleNow = () => {
  const i = dayIndex(today());
  return i < 0 ? 1 : Math.floor(i / 20) + 1;
};

const setsFor = (key, week) => {
  const scheme = key === 'pc' ? PC_SCHEMES[week] : SCHEMES[week];
  const tm = state.tm[key] || 0;
  return scheme.map(([pct, reps]) => ({ pct, reps, kg: tm ? round25(tm * pct) : null }));
};

    ${METCONS.map(w => `
      <button class="card metcon-item" style="text-align:left" data-a="openMetcon" data-id="${w.id}" data-search="${esc([w.title, w.category, ...w.equipped, ...w.bodyweight].join(' ').toLowerCase())}" data-category="${esc(w.category)}">
        <div class="row">
          <span class="tag">${esc(w.category)}</span>
          <span class="tiny ok font-bold">Megnyitás ›</span>
        </div>
        <h3 style="margin-top:2px">${esc(w.title)}</h3>
        <div class="tags">
          <span class="tag">${esc(w.duration)}</span>
          <span class="tag">Cél: ${esc(w.target)}</span>
        </div>
      </button>
    `).join('')}
  </div>
  <p id="metcon-empty" class="card small mut hidden" style="text-align:center">Nincs találat a keresésre.</p>
  `;
}

function filterMetcons(){
  const q = ($('#metcon-search')?.value || '').trim().toLocaleLowerCase('hu-HU');
  const cat = $('#metcon-filter')?.value || 'all';
  let visible = 0;
  document.querySelectorAll('.metcon-item').forEach(el => {
    const ok = (cat === 'all' || el.dataset.category === cat) && (!q || (el.dataset.search || '').includes(q));
    el.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  $('#metcon-empty')?.classList.toggle('hidden', visible > 0);
}

/* 3. NÉZET: FUTÁS (HINSHAW 5K - TISZTA, SZERKESZTETT BLOKKOK) */
function vRun(){
  const P = getHinshawPaces();
  return `
  <section class="card">
    <div class="h">Chris Hinshaw Aerobic Capacity</div>
    <h2>5K Futóteljesítmény Növelő Program</h2>
    <p class="small mut">Strukturált, energiarendszerekre épülő 6 hetes futóterv. Add meg a cél 5 km-es és 2 km-es idődet a zónák kiszámításához.</p>
    
    <div class="grid2">
      <div>
        <label class="lbl">5 km Cél / PB (MM:SS)</label>
        <input class="field time" id="run-5k" type="text" value="${esc(state.runTimes.t5)}" placeholder="24:00" maxlength="5">
      </div>
      <div>
        <label class="lbl">2 km vagy 1 mérföld (MM:SS)</label>
        <input class="field time" id="run-2k" type="text" value="${esc(state.runTimes.t2)}" placeholder="08:30" maxlength="5">

    <div class="h" style="margin-top:8px">Kiszámolt Zónatempók</div>
    <div class="grid2">

        <span class="tiny dim uppercase block">@Speed (Anaerob)</span>
        <b class="mono" style="font-size:16px;color:#fff">${P.speed} /km</b>
      </div>
      <div style="background:var(--card-sub);padding:10px 12px;border-radius:12px;border:1px solid var(--line)">
        <span class="tiny dim uppercase block">@5K (VO2 Max)</span>
        <b class="mono" style="font-size:16px;color:var(--em)">${P.p5k} /km</b>
      </div>
      <div style="background:var(--card-sub);padding:10px 12px;border-radius:12px;border:1px solid var(--line)">
        <span class="tiny dim uppercase block">@Tempo (Küszöb)</span>

      <div style="background:var(--card-sub);padding:10px 12px;border-radius:12px;border:1px solid var(--line)">
        <span class="tiny dim uppercase block">@Easy (Z2 Bázis)</span>
        <b class="mono" style="font-size:16px;color:#fff">${P.easy} /km</b>

    </div>
  </section>

  <!-- HETEK ÉS EDZÉSEK SZERKESZTETT ELRENDEZÉSBEN -->
  <div style="display:grid;gap:16px">
    ${HINSHAW_PROGRAM.map(w => `
      <section class="card" style="padding:16px">
        <div class="row">
          <span class="tag" style="background:#fff;color:#000;border-color:#fff">${w.week}. HÉT</span>
          <span class="tiny dim uppercase font-bold">3 edzés / hét</span>
        </div>
        <h3 style="margin-top:2px">${esc(w.title)}</h3>

        <div style="display:grid;gap:12px;margin-top:4px">
          ${w.sessions.map((ses, sIdx) => `
            <div style="background:var(--card-sub);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px">
              
              <!-- Edzés fejléc -->
              <div class="row">
                <div>
                  <span class="tag" style="padding:2px 8px;font-size:9px">${ses.badge}</span>
                  <h4 style="font-size:14px;font-weight:800;margin-top:4px">${sIdx + 1}. Edzés: ${esc(ses.title)}</h4>
                </div>
                <button class="btn sm" data-a="logRunSession" data-w="${w.week}" data-s="${sIdx}">Naplózás</button>
              </div>

              <!-- 1. Bemelegítés blokk -->
              <div style="padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:10px;border-left:3px solid var(--dim)">
                <span class="tiny dim uppercase font-bold block">1. Bemelegítés</span>
                <p class="small" style="color:#d4d4d8;margin-top:2px">${applyHinshawPaces(ses.warmup)}</p>
              </div>

              <!-- 2. Fő rész blokk -->
              <div style="padding:10px 12px;background:rgba(255,255,255,0.05);border-radius:12px;border:1px solid var(--line-strong)">
                <span class="tiny uppercase font-bold block" style="color:var(--em)">2. Fő Rész</span>
                <p style="font-size:14px;font-weight:800;color:#fff;margin-top:2px;line-height:1.4">${applyHinshawPaces(ses.main)}</p>
                <div style="margin-top:6px;font-size:12px;color:var(--mut)">
                  <b class="dim">Pihenő:</b> ${esc(ses.rest)}

              <!-- 3. Levezetés blokk -->
              <div style="padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:10px;border-left:3px solid var(--dim)">
                <span class="tiny dim uppercase font-bold block">3. Levezetés</span>
                <p class="small" style="color:#d4d4d8;margin-top:2px">${applyHinshawPaces(ses.cooldown)}</p>

              <!-- Fókusz -->

/* 4. NÉZET: PROFIL & NAPLÓ */
function vProfile(){
  return `
  <section class="card">
    <div class="row">
      <div class="h">5/3/1 Training Max (TM)</div>
      <button class="btn sm" data-a="applyCycle">+ Ciklus Léptetés</button>
    </div>
    <p class="small mut">A munkasúlyok a Training Maxból (TM) számolódnak (1RM 90%-a).</p>
    <div class="grid2">
      ${LIFTS.map(l => `
        <div style="background:var(--card-sub);padding:12px;border-radius:15px;border:1px solid var(--line)">
          <label class="lbl">${l.name}</label>

  <section class="card">
    <div class="row">
      <div class="h">Összes Rögzített Edzés</div>

function logCard(l){
  return `
  <article class="card" style="background:var(--card-sub);padding:12px">
    <div class="row" style="align-items:flex-start">
      <div>
        <span class="tag">${esc(l.type)}</span>
        <h4 style="margin:4px 0 0;font-size:14px;font-weight:800">${esc(l.title)}</h4>
        <span class="tiny dim">${esc(fmtDate(l.date))}</span>
      </div>
      <button class="btn sm danger" data-a="delLog" data-id="${esc(l.id)}">✕</button>
    </div>
    ${l.details ? `<pre style="margin-top:6px;white-space:pre-wrap;font:inherit;font-size:12px;color:#d4d4d8">${esc(l.details)}</pre>` : ''}
  </article>`;
}

/* METCON POPUP ÉS KETTŐS VARIÁNS KAPCSOLÓ */
let timerState = { id: null, sec: 900, running: false };
const timerFmt = n => `${Math.floor(n / 60)}:${pad(n % 60)}`;

function timerTick(){
  const d = $('#timer-display');
  if (timerState.sec > 0){
    timerState.sec--;
    if (d) d.textContent = timerFmt(timerState.sec);
  } else {
    clearInterval(timerState.id);
    timerState.running = false;
    const b = $('#timer-btn'); if (b) b.textContent = 'Start';
    toast('Lejárt az idő!');
  }
}

function openMetcon(id){
  const w = METCONS.find(x => x.id === id); if (!w) return;
  activeModalMetconId = id;
  activeMetconMode = state.metconModes[id] || 'equipped';
  clearInterval(timerState.id);
  timerState = { id: null, sec: 900, running: false };
  renderMetconModal();
}

function renderMetconModal(){
  const w = METCONS.find(x => x.id === activeModalMetconId); if (!w) return;
  const isEq = activeMetconMode === 'equipped';
  const activeItems = isEq ? w.equipped : w.bodyweight;

  modal(`
  <div class="row">
    <div>
      <span class="tag">${esc(w.category)}</span>
      <h2 style="margin-top:4px">${esc(w.title)}</h2>
    </div>
    <button class="btn sm white" data-a="closeModal">✕</button>
  </div>

  <!-- Súlyzós / Sajáttestsúlyos Váltókapcsoló -->
  <div style="background:var(--card-sub);padding:4px;border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid var(--line)">
    <button class="btn sm ${isEq ? 'white' : ''}" data-a="setMetconVariant" data-mode="equipped" style="border:0">🏋️ Súlyzós / Eszközös</button>
    <button class="btn sm ${!isEq ? 'white' : ''}" data-a="setMetconVariant" data-mode="bodyweight" style="border:0">🤸 Sajáttestsúlyos (Otthoni)</button>
  </div>

  <div class="timerbox">
    <div class="h">Edzésóra (15 perc)</div>
    <div id="timer-display" class="timerdisplay">${timerFmt(timerState.sec)}</div>
    <button class="btn pri" id="timer-btn" data-a="toggleTimer">Indítás</button>
  </div>

  <div style="background:var(--card-sub);padding:14px;border-radius:15px;border:1px solid var(--line)">
    <div class="row" style="margin-bottom:6px">
      <div class="h em">${isEq ? 'Eszközös Feladatsor' : 'Sajáttestsúlyos Otthoni Feladatsor'}</div>
      <span class="tiny dim">Koppints ha kész</span>
    </div>
    ${activeItems.map(it => `
      <label class="movement-check">
        <input type="checkbox">
        <span>${esc(it)}</span>
      </label>
    `).join('')}
  </div>

  <div class="notice">
    <h4>Taktika & Munkatempó</h4>
    <p>${esc(w.stimulus)}</p>
    <p style="margin-top:4px;color:#fff"><b>Célkitűzés:</b> ${esc(w.target)} (RPE: ${esc(w.rpe)})</p>
  </div>

  <div style="display:grid;gap:6px">
    ${w.tips.map(([a, b]) => `
      <div style="background:var(--card-sub);padding:10px 12px;border-radius:12px;border:1px solid var(--line)">
        <b style="font-size:12px;color:#fff">${esc(a)}</b>
        <p class="small mut" style="margin-top:2px">${esc(b)}</p>
      </div>
    `).join('')}
  </div>

  <button class="btn pri" data-a="logLibrary" data-id="${w.id}">Naplózás a mai napra</button>
  `);
}

const modal = html => { const m = $('#modal'); m.innerHTML = `<div class="panel">${html}</div>`; m.classList.remove('hidden'); };
const closeModal = () => { clearInterval(timerState.id); $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; activeModalMetconId = null; };

/* MŰVELETEK */
function addLog(o){ state.logs.unshift({ id: uid(), ...o }); save(); }

const A = {
  tab(d){ tab = d.t; closeModal(); render(); window.scrollTo(0, 0); },
  date(d){ selectedDate = d.d; render(); },
  jumpToday(){ selectedDate = today(); render(); },
  jumpStart(){ selectedDate = state.programStart; render(); },
  closeModal,
  openMetcon(d){ openMetcon(d.id); },
  setMetconVariant(d){
    activeMetconMode = d.mode;
    if(activeModalMetconId) {
      state.metconModes[activeModalMetconId] = d.mode;
      save();
    }
    renderMetconModal();
  },
  toggleTimer(){
    const b = $('#timer-btn');
    if (timerState.running){
      clearInterval(timerState.id);
      timerState.running = false;
      if (b) b.textContent = 'Folytatás';
    } else {
      timerState.running = true;
      timerState.id = setInterval(timerTick, 1000);
      if (b) b.textContent = 'Szünet';
    }
  },
  logLibrary(d){
    const w = METCONS.find(x => x.id === d.id); if (!w) return;
    const isEq = activeMetconMode === 'equipped';
    const items = isEq ? w.equipped : w.bodyweight;
    addLog({
      date: selectedDate, type: 'Metcon', title: `${w.title} (${isEq ? 'Eszközös' : 'Otthoni testsúlyos'})`,
      details: `${w.format} · ${w.duration}\n${items.join('\n')}`
    });
    closeModal(); render(); toast('Metcon elmentve!');
  },
  logStrength(){
    const p = planFor(selectedDate);
    if (p.kind !== 'strength') return;
    const key = p.lift.key, ss = setsFor(key, p.week), reps = Number($('#amrap')?.value) || 0, top = ss[2];
    const amrap = reps > 0 && top.kg ? `\nAMRAP: ${kgFmt(top.kg)} kg × ${reps} rep → Becsült 1RM: ${Math.round(top.kg * (1 + reps / 30))} kg` : '';
    addLog({
      date: selectedDate, type: 'Súlyemelés', title: `5/3/1 ${LIFT[key].name}`,
      details: `${p.week}. hét · TM: ${kgFmt(state.tm[key])} kg\n${ss.map((s, idx) => `${idx + 1}. sorozat:${Math.round(s.pct * 100)}% = ${kgFmt(s.kg)} kg × ${s.reps}`).join('\n')}${amrap}`
    });
    render(); toast('Erőedzés mentve!');
  },
  editGroupWod(){
    const current = state.dailyWods[selectedDate] || '';
    modal(`
      <div class="row">
        <h3>Csoportos WOD Beírása</h3>
        <button class="btn sm white" data-a="closeModal">✕</button>
      </div>
      <p class="small mut">Erre a napra (${fmtDate(selectedDate)}) írd be a teremben elvégzett csoportos edzést:</p>
      <textarea class="field" id="wod-input" rows="6" placeholder="Pl.\n5 kör időre:\n• 400 m futás\n• 15 burpee over bar\n• 15 toes to bar">${esc(current)}</textarea>
      <button class="btn pri" data-a="saveGroupWod">WOD Mentése</button>
    `);
  },
  saveGroupWod(){
    const val = ($('#wod-input')?.value || '').trim();
    if (val) { state.dailyWods[selectedDate] = val; }
    else { delete state.dailyWods[selectedDate]; }
    save(); closeModal(); render(); toast('Csoportos WOD frissítve!');
  },
  logGroupWodResult(){
    const score = ($('#gwod-score')?.value || '').trim();
    const load = ($('#gwod-load')?.value || '').trim();
    const notes = ($('#gwod-notes')?.value || '').trim();
    const currentWod = state.dailyWods[selectedDate] || 'Csoportos edzés';

    if (!score && !load && !notes) return toast('Írj be legalább egy eredményt!', true);

    const res = [
      score ? 'Eredmény: ' + score : '',
      load ? 'Súly/Skálázás: ' + load : '',
      notes ? 'Megjegyzés: ' + notes : ''
    ].filter(Boolean).join('\n');

    addLog({
      date: selectedDate, type: 'Metcon', title: 'Csoportos Edzés Metcon',
      details: `${currentWod}\n\n${res}`
    });
    render(); toast('WOD eredmény naplózva!');
  },
  logRunSession(d){
    const w = HINSHAW_PROGRAM.find(x => x.week === Number(d.w));
    if (!w) return;
    const s = w.sessions[Number(d.s)];
    addLog({
      date: selectedDate, type: 'Futás', title: `${w.week}. Hét · ${s.title}`,
      details: `1. Bemelegítés: ${s.warmup}\n2. Fő rész: ${s.main} (Pihenő: ${s.rest})\n3. Levezetés: ${s.cooldown}\nFókusz: ${s.focus}`
    });
    render(); toast('Futóedzés naplózva!');
  },
  saveRunTimes(){
    const a = normalizeTime($('#run-2k').value), b = normalizeTime($('#run-5k').value);
    if (!b) return toast('Add meg legalább az 5K idődet!', true);
    state.runTimes = { t2: a || '08:30', t5: b };
    save(); render(); toast('Hinshaw tempók és edzésterv frissítve!');
  },
  delLog(d){
    if (!confirm('Törlöd ezt az edzést?')) return;
    state.logs = state.logs.filter(x => x.id !== d.id);
    save(); render(); toast('Törölve.');
  },
  saveTm(){
    for (const l of LIFTS){
      const v = $('#tm-' + l.key).value.trim(), n = Number(v);
      state.tm[l.key] = v === '' ? null : round25(n);
    }
    save(); render(); toast('Súlyok mentve!');
  },
  saveStart(){
    state.programStart = $('#pstart').value;
    save(); render(); toast('Kezdődátum mentve!');
  },
  applyCycle(){
    if (!confirm('Lépteted a ciklust? Felsőtest & Clean: +2.5kg, Alsótest: +5kg.')) return;
    for (const l of LIFTS) state.tm[l.key] = round25(state.tm[l.key] + (l.upper ? 2.5 : 5));
    state.cycleApplied = (state.cycleApplied || 1) + 1;
    save(); render(); toast(`${state.cycleApplied}. ciklus aktiválva!`);
  },
  shareBackup(){
    const json = JSON.stringify({ app: 'strng-training', state }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = `strng_mentes_${today()}.json`;
    a.click();
    toast('Fájl letöltve!');
  },
  wipe(){
    if (!confirm('FIGYELEM: Minden mentett adat törlődik. Folytatod?')) return;
    localStorage.clear();
    state = baseState();
    render();
    toast('Alaphelyzetbe állítva.');
  }
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset, el);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'run-2k' || t.id === 'run-5k') {
    const v = liveTime(t.value);
    if (t.value !== v) t.value = v;
  }
  if (t.id === 'metcon-search') filterMetcons();
  if (t.id === 'amrap'){
    const val = Number(t.value), p = planFor(selectedDate);
    if (val > 0 && p.lift){
      const ss = setsFor(p.lift.key, p.week), top = ss[2];
      if (top.kg) $('#amrap-est').textContent = `Becsült 1RM: ${Math.round(top.kg * (1 + val / 30))} kg`;
    } else if ($('#amrap-est')) { $('#amrap-est').textContent = ''; }
  }
  const m = /^orm-(\w+)$/.exec(t.id || '');
  if (m){
    const n = Number(t.value), tm = $('#tm-' + m[1]);
    if (tm) tm.value = n > 0 ? round25(n * 0.9) : '';
  }
});

document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.id === 'run-2k' || t.id === 'run-5k') t.value = normalizeTime(t.value);
});

document.addEventListener('change', e => {
  if (e.target.id === 'metcon-filter') filterMetcons();
});

selectedDate = today();
render();
})();
</script>
</body>
</html>
