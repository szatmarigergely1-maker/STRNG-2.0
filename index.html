<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STRNG">
<meta name="robots" content="noindex, nofollow">
<title>STRNG Training</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --card:#111113;
  --card-sub:#18181b;
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.16);
  --text:#ffffff;
  --mut:#a1a1aa;
  --dim:#71717a;
  --em:#30d158;
  --em-dim:rgba(48,209,88,0.12);
  --sky:#0a84ff;
  --sky-dim:rgba(10,132,255,0.12);
  --amb:#ff9f0a;
  --amb-dim:rgba(255,159,10,0.12);
  --red:#ff453a;
  --red-dim:rgba(255,69,58,0.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  font-size:14px;
  line-height:1.45;
  overscroll-behavior-y:none;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* Apple Header */
.top{
  position:sticky;top:0;z-index:25;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:20px;font-weight:900;letter-spacing:-0.04em}
.brand span{
  font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--mut);border-left:1px solid var(--line);padding-left:8px;
}
.pill{
  font-size:11px;font-weight:800;color:var(--em);
  background:var(--em-dim);border:1px solid rgba(48,209,88,0.25);
  border-radius:999px;padding:4px 10px;white-space:nowrap;letter-spacing:0.04em;
}

/* Layout & Kártyák */
.wrap{max-width:540px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:18px;display:grid;gap:12px;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Tipográfia */
.h{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--mut)}
.h.em{color:var(--em)}
.h.sky{color:var(--sky)}
.h.amb{color:var(--amb)}
h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.02em}
h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.01em}
p{margin:0}
.mut{color:var(--mut)}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.tiny{font-size:10.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* Címkék */
.tag{
  display:inline-flex;align-items:center;border:1px solid var(--line);
  background:var(--card-sub);color:var(--mut);border-radius:999px;
  padding:4px 9px;font-size:10px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
}
.tag.em{color:var(--em);border-color:rgba(48,209,88,0.25);background:var(--em-dim)}
.tag.sky{color:var(--sky);border-color:rgba(10,132,255,0.25);background:var(--sky-dim)}
.tag.amb{color:var(--amb);border-color:rgba(255,159,10,0.25);background:var(--amb-dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* Apple Gombok */
.btn{
  width:100%;border:1px solid var(--line);background:var(--card-sub);
  border-radius:14px;padding:13px 16px;font-weight:800;font-size:12px;
  letter-spacing:0.04em;text-transform:uppercase;text-align:center;
  transition:transform 0.1s ease;
}
.btn:active{transform:scale(0.97)}
.btn.pri{background:var(--em);color:#000;border-color:var(--em);font-weight:900}
.btn.sky{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:900}
.btn.white{background:#fff;color:#000;border-color:#fff;font-weight:900}
.btn.sm{width:auto;padding:7px 12px;font-size:11px;border-radius:10px}
.btn.danger{color:var(--red);border-color:rgba(255,69,58,0.2);background:var(--red-dim)}

/* Mezők */
.field{
  width:100%;background:var(--card-sub);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;color:#fff;font:inherit;font-size:15px;outline:none;
}
.field:focus{border-color:var(--em)}
textarea.field{resize:vertical;min-height:72px}
.time{text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.06em;font-weight:800}
.lbl{display:block;font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}

/* Dobozok */
.notice{
  border:1px solid rgba(255,159,10,0.25);background:var(--amb-dim);
  border-radius:16px;padding:14px;display:grid;gap:6px;
}
.notice h4{margin:0;font-size:12.5px;font-weight:800;color:#fcd34d}
.notice p{font-size:12px;color:#e4e4e7}
.notice.sky{border-color:rgba(10,132,255,0.25);background:var(--sky-dim)}
.notice.sky h4{color:#7dd3fc}
.notice.em{border-color:rgba(48,209,88,0.25);background:var(--em-dim)}
.notice.em h4{color:#86efac}

/* Vízszintes naptár */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{
  min-width:58px;padding:9px 6px;border:1px solid var(--line);
  background:var(--card);border-radius:15px;text-align:center;flex:0 0 auto;
  transition:all 0.15s ease;
}
.day:active{transform:scale(0.95)}
.day small{display:block;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--dim)}
.day strong{display:block;font-size:16px;font-weight:900;margin:1px 0}
.day em{display:block;font-style:normal;font-size:8px;font-weight:900;letter-spacing:0.04em;color:var(--dim)}
.day.on{background:#fff;border-color:#fff;color:#000}
.day.on small,.day.on em{color:#000}
.day.done em{color:var(--em)}
.day.on.done em{color:#000}

/* Elemek és sorok */
.setrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);padding:9px 0;
}
.setrow:last-child{border:0;padding-bottom:0}
.setrow b{font-size:15px;font-weight:800}
.setrow span{font-size:11px;color:var(--dim)}
.step{display:grid;gap:3px;padding:6px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step b{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--sky)}
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.item:last-child{border:0}
.item i{font-style:normal;font-weight:800;color:var(--em);font-size:11px;width:16px;text-align:right;flex-shrink:0}

/* Időmérő és interaktív feladatlista */
.timerbox{
  border:1px solid var(--line-strong);background:#070709;
  border-radius:18px;padding:16px;display:grid;gap:12px;
}
.timerdisplay{
  font:900 48px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:0.02em;text-align:center;font-variant-numeric:tabular-nums;
}
.timerstatus{text-align:center;font-size:10px;color:var(--mut);font-weight:900;text-transform:uppercase;letter-spacing:0.12em}
.progress-track{height:6px;background:#27272a;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--em);transition:width 0.2s ease}
.movement-check{
  display:flex;align-items:flex-start;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer;
}
.movement-check:last-child{border-bottom:0}
.movement-check input{accent-color:var(--em);width:19px;height:19px;flex-shrink:0;margin:0}
.movement-check.done span{text-decoration:line-through;color:var(--dim)}

/* Apple Alsó Menüsáv */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(10,10,12,0.85);
  backdrop-filter:blur(25px) saturate(180%);
  -webkit-backdrop-filter:blur(25px) saturate(180%);
  border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
nav button{
  border-radius:14px;padding:8px 4px;
  color:var(--dim);font-size:10px;font-weight:800;letter-spacing:0.02em;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:all 0.15s ease;
}
nav button b{font-size:18px;line-height:1}
nav button.on{color:#fff;background:rgba(255,255,255,0.08)}

/* Modal & Toast */
.modal{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
}
.panel{
  max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line-strong);
  border-radius:24px;padding:20px;display:grid;gap:14px;
}
.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:60;background:#fff;color:#000;
  padding:10px 18px;border-radius:999px;font-size:12px;font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);max-width:90vw;text-align:center;
}
.toast.err{background:var(--red);color:#fff}
.view{animation:in 0.18s cubic-bezier(0.2,0.8,0.2,1)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>STRNG</b><span id="title">Mai terv</span></div>

</header>

<main id="view" class="wrap view"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
(()=>{'use strict';

const KEY='strng_training_system_v3',OLD_KEY='strng_training_system_v2',DEFAULT_START='2026-10-17';
const $=s=>document.querySelector(s);

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const pd=s=>new Date(s+'T12:00:00');
const fmtDate=s=>pd(s).toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'});
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
const kgFmt=n=>String(n).replace('.',',');
const round25=n=>Math.round(n/2.5)*2.5;

function liveTime(raw){
  const idx=raw.search(/\D/),all=raw.replace(/\D/g,'').slice(0,4);
  if(idx>=0){
    const m=raw.slice(0,idx).replace(/\D/g,''),s=raw.slice(idx).replace(/\D/g,'');
    if(m.length>=1&&m.length<=2&&s.length<=2)return m+':'+s;
  }
  if(all.length<=2)return all;
  if(all.length===3)return all[0]+':'+all.slice(1);
  return all.slice(0,2)+':'+all.slice(2);
}
function normalizeTime(raw){
  raw=String(raw||'').trim();if(!raw)return '';
  const idx=raw.search(/\D/);let m,s;
  if(idx>=0){m=raw.slice(0,idx).replace(/\D/g,'');s=raw.slice(idx).replace(/\D/g,'');}
  else{const d=raw.slice(0,4);if(d.length<=2){m=d;s='';}else if(d.length===3){m=d[0];s=d.slice(1);}else{m=d.slice(0,2);s=d.slice(2);}}
  return m===''?raw:pad(+m)+':'+pad(+(s||0));
}
const toSec=t=>{const m=/^(\d{1,2}):([0-5]\d)$/.exec(String(t||'').trim());return m?(+m[1])*60+(+m[2]):null};
const fmtPace=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${pad(s%60)}`};

/* ============ ERŐ GYAKORLATOK ============ */

 {key:'sq',short:'SQUAT',accessory:'TRX/gyűrűs evezés 3×12, majd saját testsúlyos kitörés 3×8 oldalanként.',tip:'Mély hasi levegővétel (bracing), a törzs feszes, a testsúly a teljes talpon oszlik el. Csak tiszta, fájdalommentes mélységbe menj.'},
 {key:'ohp',short:'OHP',accessory:'TRX/gyűrűs evezés 3×12, majd oldalsó plank 3×30 mp oldalanként.',tip:'Feszítsd meg a farizmodat és a hasadat, kerüld a derék túlzott homorítását. A rudat függőleges vonalban nyomd a fejed fölé.'},
 {key:'dl',short:'DEADLIFT',accessory:'Goblet squat 3×10 közepes súllyal, majd dead bug 3×10 oldalanként.',tip:'A rúd végig a tested közvetlen közelében mozog. A talaj eltolásával indítsd a mozgást, ne derékból rántsd meg a súlyt.'}
];
const SCHEMES={1:[[.65,'5'],[.75,'5'],[.85,'5+']],2:[[.70,'3'],[.80,'3'],[.90,'3+']],3:[[.75,'5'],[.85,'3'],[.95,'1+']],4:[[.40,'5'],[.50,'5'],[.60,'5']]};
const WARMUP=[[.40,5],[.50,5],[.60,3]];

/* ============ 15 KONDÍCIÓS EDZÉS (METCON) ============ */
const METCONS=[
{id:"engine-ladder",title:"Engine Ladder",subtitle:"Aerob kapacitás & ritmus",category:"Kondíció",duration:"Cap 20:00",rpe:"8.5/10",target:"Célidő: 16:30 – 18:30",format:"5 kör időre",
 blocks:[{title:"5 kör időre (For Time)",items:["500 m Evezés (Row)","15 Burpee over rower (evezőn átugró burpee)","20 Wall Ball shot (9/6 kg)"]}],
 stimulus:"Klasszikus aerob motor teszt. A pulzus stabilan a 85-90%-os zónában marad.",
 strategy:"Az evezésen tartsd a 2k-s tempód +5-7 másodperccel lassabban (kb. 1:55-2:00/500m). A burpeenél lépkedős ritmust válassz, a fali labdát 12+8-as bontásban végezd.",
 tips:[["Evezés","Ne rántsd el az első 500 métert. Tarts egyenletes csapásszámot (26-28 s/m)."],["Burpee","Ne állj meg fújni: lépj fel és lépj le egyenletesen."],["Wall Ball","A labdát a mellkasnál fogd, ne engedd le a combodra a guggolás alján."]]},

{id:"echo-chipper",title:"Echo Chipper",subtitle:"Erő-állóképesség",category:"Chipper",duration:"Cap 22:00",rpe:"9/10",target:"Célidő: 17:00 – 19:30",format:"Időre (For Time)",
 blocks:[{title:"Chipper feladatsor",items:["40 Cal Echo Bike","30 Dumbbell Snatch (22.5 / 15 kg)","30 Box Jump Over (60 / 50 cm)","30 Dumbbell Thruster (2×15 / 2×10 kg)","40 Cal Echo Bike"]}],
 stimulus:"Magas metabolikus savasodás és láb-állóképesség.",

{id:"tri-erg-aerobic",title:"Tri-Erg Aerobic Capacity",subtitle:"Tiszta aerob motor",category:"Kardió",duration:"34:00 (3 kör)",rpe:"8/10",target:"Cél: egyenletes köridők (28-31 perc)",format:"3 kör · körök közt 2:00 pihenő",
 blocks:[{title:"Minden körben teljesítendő",items:["1000 m SkiErg","1500 m Evezés (Row)","2500 m Echo Bike / C2 Bike"],note:"A körök között pontosan 2:00 pihenő kötelező."}],
 stimulus:"Tiszta zóna 2-3 aerob fejlesztés, zsírégető és mitokondriális bázisépítés.",

{id:"kettlebell-shuttle",title:"Kettlebell & Shuttle Grinder",subtitle:"Középtávú állóképesség",category:"Kondíció",duration:"Cap 20:00",rpe:"8.5/10",target:"Célidő: 15:30 – 18:00",format:"4 kör időre",
 blocks:[{title:"4 kör időre",items:["400 m Futás (vagy 25 Cal Evezés)","24 Kettlebell Swing (24 / 16 kg)","16 KB Goblet Guggolás (24 / 16 kg)","12 Burpee Box Jump Over (60 / 50 cm)"]}],

{id:"cardio-monster-emom",title:"Cardio Monster EMOM 24",subtitle:"Magas intenzitású intervallum",category:"Intervallum",duration:"24:00 fix",rpe:"9/10",target:"Minden feladat 45-48 mp alatt",format:"EMOM 24 perc (6 teljes kör)",
 blocks:[{title:"Minden perc új állomás",items:["1. perc: 18/14 Cal Evezés","2. perc: 15 Burpee","3. perc: 16/12 Cal Echo Bike","4. perc: 50 Double Unders (vagy 75 szimpla)"]}],

 strategy:"Ha valamelyik percben 52 másodperc fölé csúszol, a következő körben vegyél vissza 2 ismétlést.",
 tips:[["Légzés","Az evezőn és a bringán hangold össze a légzésed a mozdulat ritmusával."],["Kötél","Laza vállak, csuklóból pörgess."]]},

{id:"lactate-tolerance",title:"Lactate Tolerance Chipper",subtitle:"Küszöb feletti ellenállás",category:"Kondíció",duration:"Cap 22:00",rpe:"9/10",target:"Célidő: 17:30 – 19:30",format:"3 kör időre",
 blocks:[{title:"3 kör időre",items:["400 m Futás (vagy 24 Cal SkiErg)","15 Rúddal végzett Thruster (42.5 / 30 kg)","15 Bar-Facing Burpee","20 Cal Evezés"]}],
 stimulus:"Nagyfokú savasodás kezelése, mentális fegyelem a rúddal és evezőn.",

 tips:[["Thruster","Guggolj dinamikusan és a láblökés juttassa fej fölé a rudat."],["Evezés","Hosszú, ritmusos húzások."]]},

{id:"the-40min-engine",title:"The 40-Min Engine Test",subtitle:"Hosszútávú állóképesség",category:"Kardió",duration:"40:00 AMRAP",rpe:"8/10",target:"Cél: 3 – 3.5 teljes kör",format:"40 perc folyamatos AMRAP",
 blocks:[{title:"Folyamatos körmunka 40 percen át",items:["1000 m Evezés","40 Guggolás saját testsúllyal (Air Squats)","800 m Futás","30 Fekvőtámasz (Push-ups)","20 Húzódzkodás (Pull-ups) vagy Ring Row","50 Cal Bike"]}],
 stimulus:"Hosszútávú aerob bázis és izom-állóképesség kombinációja.",

/* ============ BIZTONSÁGOS ADATTÁROLÁS ============ */
const baseState=()=>({programStart:DEFAULT_START,tm:{sq:120,bp:90,dl:150,ohp:60},runTimes:{t2:'08:30',t5:'24:00'},logs:[],cycleApplied:1,tmHistory:[],runHistory:[],lastBackup:0});

function sanitize(s){
  const b=baseState();
  if(!s||typeof s!=='object')return b;
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(s.programStart||'')))b.programStart=s.programStart;
  for(const l of LIFTS){
    const n=Number(s.tm?.[l.key]);
    if(Number.isFinite(n)&&n>0)b.tm[l.key]=round25(n);
  }
  const r=s.runTimes||{};
  if(r.t2)b.runTimes.t2=r.t2;
  if(r.t5)b.runTimes.t5=r.t5;
  if(Array.isArray(s.logs))b.logs=s.logs.filter(x=>x&&x.id&&x.date);
  if(Array.isArray(s.tmHistory))b.tmHistory=s.tmHistory;
  if(Array.isArray(s.runHistory))b.runHistory=s.runHistory;
  b.cycleApplied=Number.isInteger(s.cycleApplied)?s.cycleApplied:1;
  b.lastBackup=Number(s.lastBackup)||0;
  return b;
}

function load(){
  try{
    const v3=localStorage.getItem(KEY);if(v3)return sanitize(JSON.parse(v3));
    const v2=localStorage.getItem(OLD_KEY);if(v2)return sanitize(JSON.parse(v2));
  }catch(e){}
  return baseState();
}

const clampDate=d=>d<state.programStart?state.programStart:d;
const dayIndex=date=>{
  const[y,m,d]=date.split('-').map(Number),[a,b,c]=state.programStart.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,d)-Date.UTC(a,b-1,c))/864e5);
};

function planFor(date){
  const i=dayIndex(date);
  if(i<0)return{kind:'before'};
  if(i%2===0){
    const n=i/2;
    return{kind:'strength',lift:ROT[n%4],week:Math.floor(n/4)%4+1,metcon:METCONS[n%METCONS.length],parts:['wendler','metcon']};
  }
  const n=(i-1)/2;
  return{kind:'run',run:RUNS[n%RUNS.length],parts:['run']};
}

const cycleNow=()=>{const i=dayIndex(today());return i<0?1:Math.floor(i/30)+1};
const logsOn=d=>state.logs.filter(l=>l.date===d);
const partLog=(d,p)=>state.logs.find(l=>l.date===d&&l.part===p);
const dayState=d=>{
  const p=planFor(d);if(p.kind==='before')return 'none';
  const n=p.parts.filter(x=>partLog(d,x)).length;
  return n===0?'todo':n===p.parts.length?'done':'part';
};
const sets=(key,week)=>SCHEMES[week].map(([pct,reps])=>({pct,reps,kg:state.tm[key]?round25(state.tm[key]*pct):null}));

function runProfile(){
  const t2=toSec(state.runTimes.t2),t5=toSec(state.runTimes.t5);
  if(!t2||!t5||t2/2>=t5/5)return null;
  return{t2,t5,p2:t2/2,p5:t5/5};
}
const rng=(z,P)=>{const[a,b]=ZONES[z].range(P);return`${fmtPace(a)}–${fmtPace(b)} /km`};
function runTarget(run,P){
  if(!P)return null;
  const[a,b]=ZONES[run.zone].range(P);
  switch(run.zone){
   case'interval':return`Résztávok: ${fmtPace(P.p2)} /km (@2k) és ${fmtPace(P.p5)} /km (@5k)`;
   case'tempo':return`Küszöbtempó: ${rng('tempo',P)}`;
   case'progression':return`Középső szakasz: ${rng('progression',P)}`;
   case'recovery':return`Regeneráló: ${rng('recovery',P)}`;
   default:return`Z2 alapozó: ${rng('easy',P)}`;
  }
}

/* ============ INTERAKTÍV METCON POPUP (TIMER + CHECKLIST) ============ */
let workoutTimer={interval:null,mode:'amrap',duration:600,remaining:600,elapsed:0,running:false,lastEmomRound:0};
const timerFmt=n=>`${Math.floor(Math.max(0,n)/60)}:${pad(Math.floor(Math.max(0,n)%60))}`;

function timerBeep(high){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(C){
      const c=new C(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=high?1050:800;
      g.gain.value=0.1;o.start();o.stop(c.currentTime+0.18);
      o.onended=()=>c.close();
    }
  }catch(_){}
  try{navigator.vibrate&&navigator.vibrate(high?[100,50,100]:80)}catch(_){}
}
function timerStopInterval(){
  if(workoutTimer.interval){clearInterval(workoutTimer.interval);workoutTimer.interval=null}
  workoutTimer.running=false;
}
function timerDisplay(){
 const display=$('#timer-display'),status=$('#timer-status');if(!display)return;
 display.textContent=timerFmt(workoutTimer.mode==='fortime'?workoutTimer.elapsed:workoutTimer.remaining);
 status.textContent=workoutTimer.running?'FUT':(workoutTimer.elapsed>0?'MEGÁLLÍTVA':'KÉSZEN ÁLL');
 const b=$('#timer-start');if(b)b.textContent=workoutTimer.running?'Szünet':'Indítás';
}
function runTimerToggle(){
  if(workoutTimer.running){
    timerStopInterval();
    timerDisplay();
  } else {
    workoutTimer.running=true;
    let last=Date.now();
    workoutTimer.interval=setInterval(()=>{
      const now=Date.now(),delta=Math.max(0,(now-last)/1000);last=now;
      workoutTimer.elapsed+=delta;
      if(workoutTimer.mode!=='fortime')workoutTimer.remaining=Math.max(0,workoutTimer.duration-workoutTimer.elapsed);
      if(workoutTimer.mode==='emom'){
        const round=Math.floor(workoutTimer.elapsed/60);
        if(round>workoutTimer.lastEmomRound){workoutTimer.lastEmomRound=round;timerBeep(true)}
      }
      if(workoutTimer.mode!=='fortime'&&workoutTimer.remaining<=0){
        timerStopInterval();timerBeep(true);toast('Lejárt az idő!');
      }
      timerDisplay();
    },200);
    timerDisplay();
  }
}
function runTimerReset(){
  timerStopInterval();
  const mins=Math.max(1,Math.min(60,Number($('#timer-minutes')?.value)||10));
  const mode=$('#timer-mode')?.value||'amrap';
  workoutTimer={interval:null,mode,duration:mins*60,remaining:mins*60,elapsed:0,running:false,lastEmomRound:0};
  timerDisplay();
}

}

   const res=[score?'Eredmény: '+score:'',load?'Súly: '+load:'',notes?'Megjegyzés: '+notes:''].filter(Boolean).join('\n');
   addLog({date:selectedDate,part:'metcon',refId:w.id,type:'Metcon',title:w.title,details:`${w.format} · ${w.duration}${res?'\n\n'+res:''}`});
   closeModal();render();toast('Metcon elmentve!');
 },
 logPart(d){
   const date=selectedDate,p=planFor(date),note=($('#res-'+d.p)?.value||'').trim();
   if(d.p==='wendler'){
     const key=p.lift.key,ss=sets(key,p.week),reps=Number($('#amrap')?.value)||0,top=ss[2];
     const amrap=reps>0&&top.kg?`\nAMRAP: ${kgFmt(top.kg)} kg × ${reps} rep → Becsült 1RM: ${Math.round(top.kg*(1+reps/30))} kg`:'';
     addLog({date,part:'wendler',type:'Súlyemelés',title:`5/3/1 ${LIFT[key].name}`,lift:key,
       details:`${p.week}. hét · TM: ${kgFmt(state.tm[key])} kg\n${ss.map((s,k)=>`${k+1}. sorozat:${Math.round(s.pct*100)}% = ${s.kg?kgFmt(s.kg)+' kg':'–'} × ${s.reps}`).join('\n')}${amrap}${note?'\n\n'+note:''}`});
     toast('Erőedzés naplózva!');
   } else if(d.p==='metcon'){
     const w=p.metcon;
     addLog({date,part:'metcon',refId:w.id,type:'Metcon',title:w.title,details:`${w.format} · ${w.duration}${note?'\n\n'+note:''}`});
     toast('Kondíció naplózva!');
   } else {
     const r=p.run,P=runProfile(),tg=runTarget(r,P);
     addLog({date,part:'run',type:'Futás',title:r.title,details:`${r.dist}${tg?'\nCéltempó: '+tg:''}${note?'\n\n'+note:''}`});
     toast('Futóedzés naplózva!');
   }
   render();
 },
 editLog(d){const l=state.logs.find(x=>x.id===d.id);if(l)logForm(l)},
 newLog(){logForm(null)},
 saveLogForm(d){
   const date=$('#f-date').value,title=$('#f-title').value.trim(),type=$('#f-type').value,details=$('#f-details').value.trim();
   if(!title)return toast('Add meg az edzés nevét!',true);
   if(d.id){const l=state.logs.find(x=>x.id===d.id);if(l)Object.assign(l,{date,title,type,details});save();toast('Frissítve!')}
   else{addLog({date,part:'custom',type,title,details});toast('Naplózva!')}
   closeModal();render();
 },
 delLog(d){
   if(!confirm('Biztosan törlöd ezt az edzést?'))return;
   state.logs=state.logs.filter(x=>x.id!==d.id);save();render();toast('Törölve.');
 },
 saveStart(){
   state.programStart=$('#pstart').value;save();render();toast('Kezdődátum mentve!');
 },
 saveTm(){
   for(const l of LIFTS){
     const v=$('#tm-'+l.key).value.trim(),n=Number(v);
     state.tm[l.key]=v===''?null:round25(n);
   }
   save();render();toast('Súlyok mentve!');
 },
 applyCycle(){
   if(!confirm('Lépteted a ciklust? Felsőtest: +2.5kg, Alsótest: +5kg.'))return;
   for(const l of LIFTS)state.tm[l.key]=round25(state.tm[l.key]+(l.upper?2.5:5));
   state.cycleApplied=(state.cycleApplied||1)+1;
   save();render();toast(`${state.cycleApplied}. ciklus aktiválva!`);
 },
 saveRun(){
   const a=normalizeTime($('#rt2').value),b=normalizeTime($('#rt5').value);
   if(!a||!b)return toast('Add meg mindkét időt!',true);
   state.runTimes={t2:a,t5:b};save();render();toast('Futóidők frissítve!');
 },
 async share(){
   const json=JSON.stringify({app:'strng-training',state},null,2);
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
   a.download=`strng_mentes_${today()}.json`;a.click();toast('Fájl letöltve!');
 },
 wipe(){
   if(!confirm('FIGYELEM: Minden edzésed és adatod törlődik erről az eszközről! Folytatod?'))return;
   localStorage.clear();state=baseState();render();toast('Minden adat törölve.');
 }
};

document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset,el);
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rt2'||t.id==='rt5'){const v=liveTime(t.value);if(t.value!==v){t.value=v;}}
  if(t.id==='metcon-search')filterMetcons();
  if(t.id==='amrap'){
    const val=Number(t.value),p=planFor(selectedDate);
    if(val>0&&p.lift){
      const ss=sets(p.lift.key,p.week),top=ss[2];
      if(top.kg)$('#amrap-est').textContent=`Becsült 1RM: ${Math.round(top.kg*(1+val/30))} kg`;
    }else if($('#amrap-est')){$('#amrap-est').textContent='';}
  }
  const m=/^orm-(\w+)$/.exec(t.id\vert{}\vert{}'');if(m){const n=Number(t.value),tm=$('#tm-'+m[1]);if(tm)tm.value=n>0?round25(n*.9):''}
});

document.addEventListener('focusout',e=>{const t=e.target;if(t.id==='rt2'||t.id==='rt5')t.value=normalizeTime(t.value)});

document.addEventListener('change',e=>{
  if(e.target.matches('[data-movement-check]'))updateMovementProgress();
  if(e.target.id==='metcon-filter')filterMetcons();
  if(e.target.id==='timer-mode'||e.target.id==='timer-minutes')runTimerReset();
  if(e.target.id==='restoreFile'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(String(r.result));
        if(o.state){state=sanitize(o.state);save();render();toast('Mentés sikeresen visszaállítva!');}
      }catch(_){toast('Érvénytelen fájl!',true)}
    };
    r.readAsText(f);
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

selectedDate=clampDate(today());
render();

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
</body>
</html>
