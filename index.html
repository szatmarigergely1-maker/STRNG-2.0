<script>
(()=>{'use strict';
/* ============ ALAP SEGÉDEK ============ */
const KEY='strng_training_system_v3',OLD_KEY='strng_training_system_v2',DEFAULT_START='2026-10-17';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const pd=s=>new Date(s+'T12:00:00');
const fmtDate=s=>pd(s).toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'});
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
const kgFmt=n=>String(n).replace('.',',');
const round25=n=>Math.round(n/2.5)*2.5;

/* ============ IDŐ MEZŐ: automatikus MM:SS ============ */
// Gépelés közben: 0836 → 08:36, 830 → 8:30, 8:30 → 8:30; bármilyen elválasztó (: . , szóköz) jó.
function liveTime(raw){
  const idx=raw.search(/\D/),all=raw.replace(/\D/g,'').slice(0,4);
  if(idx>=0){
    const m=raw.slice(0,idx).replace(/\D/g,''),s=raw.slice(idx).replace(/\D/g,'');
    if(m.length>=1&&m.length<=2&&s.length<=2)return m+':'+s;
  }
  if(all.length<=2)return all;
  if(all.length===3)return all[0]+':'+all.slice(1);
  return all.slice(0,2)+':'+all.slice(2);
}
// Mező elhagyásakor: 8:30 → 08:30, 25 → 25:00
function normalizeTime(raw){
  raw=String(raw||'').trim();if(!raw)return '';
  const idx=raw.search(/\D/);let m,s;
  if(idx>=0){m=raw.slice(0,idx).replace(/\D/g,'');s=raw.slice(idx).replace(/\D/g,'');}
  else{const d=raw.slice(0,4);if(d.length<=2){m=d;s='';}else if(d.length===3){m=d[0];s=d.slice(1);}else{m=d.slice(0,2);s=d.slice(2);}}
  return m===''?raw:pad(+m)+':'+pad(+(s||0));
}
const toSec=t=>{const m=/^(\d{1,2}):([0-5]\d)$/.exec(String(t||'').trim());return m?(+m[1])*60+(+m[2]):null};
const fmtPace=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${pad(s%60)}`};

/* ============ ADATOK (mint a naptár: minden egy helyen) ============ */
const LIFTS=[{key:'sq',name:'Guggolás',upper:false},{key:'bp',name:'Fekvenyomás',upper:true},{key:'dl',name:'Felhúzás',upper:false},{key:'ohp',name:'Mellből nyomás',upper:true}];
const LIFT=Object.fromEntries(LIFTS.map(l=>[l.key,l]));
const ROT=[
 {key:'bp',short:'BENCH',accessory:'DB evezés 3×10 oldalanként, majd 3×10 fekvőtámasz. Hagyd abba a sorozatot 1–2 jó ismétléssel a technikai bukás előtt.',tip:'Zárd a lapockáidat a padon, a talpad maradjon stabilan a talajon. Engedd a rudat kontrolláltan a mellkas alsó részéhez, majd nyomd felfelé stabil csuklóval.'},
 {key:'sq',short:'SQUAT',accessory:'TRX/gyűrűs evezés 3×12, majd saját testsúlyos kitörés 3×8 oldalanként.',tip:'Vegyél mély levegőt, feszítsd meg a törzsedet a leengedés előtt, és a teljes talpadon támaszkodj. Csak fájdalommentes mélységig menj.'},
 {key:'ohp',short:'OHP',accessory:'TRX/gyűrűs evezés 3×12, majd oldalsó plank 3×30 mp oldalanként.',tip:'Szorítsd a farizmot és a hasat, ne homoríts túl a derekaddal. A súlyt egyenes pályán nyomd a fejed fölé, a végén a karod legyen kinyújtva.'},
 {key:'dl',short:'DEADLIFT',accessory:'Goblet squat 3×10 könnyű-közepes súllyal, majd dead bug 3×10 oldalanként.',tip:'A súly induljon a lábadhoz közel. Feszítsd meg a törzsedet, a talaj eltolásával állj fel, és ne a derekaddal rántsd meg a súlyt.'}
];
const SCHEMES={1:[[.65,'5'],[.75,'5'],[.85,'5+']],2:[[.70,'3'],[.80,'3'],[.90,'3+']],3:[[.75,'5'],[.85,'3'],[.95,'1+']],4:[[.40,'5'],[.50,'5'],[.60,'5']]};
const WARMUP=[[.40,5],[.50,5],[.60,3]];

const METCONS=[
{id:"du-vup-core",title:"Dupla ugrókötél + core",subtitle:"Kondíció és törzs",category:"Kondíció",duration:"Time cap 15:00",rpe:"8.5–9/10",target:"Ideális idő: 10 perc alatt",format:"For time",
 blocks:[{title:"Teljesítsd sorrendben",items:["100 Double Unders (dupla ugrókötél)","50 Alternating V-ups (váltott lábas bicska felülés)","100 Double Unders","50 V-ups (bicska felülés)","100 Double Unders","50 Alternating V-ups","100 Double Unders"]}],
 stimulus:"Magas pulzus és törzs-állóképesség. A kötél a vádlikat és a vállövet, a V-up variációk a teljes hasfalat terhelik. A cél a ritmusos, folyamatos haladás.",
 strategy:"A 100-as dupla ugrásoknál törekedj tiszta, ritmusos munkára. A 50-es hasblokkokat érdemes előre megtervezett kisebb szettekre bontani, például 2×25-re vagy 5×10-re, mielőtt a törzs elfárad.",
 tips:[["Double Unders","Tartsd a könyöködet közel a törzsedhez, és csuklóból pörgesd a kötelet. Ugrálj ruganyosan, egyenes törzzsel; ne húzd túl magasra a térded."],["Alternating V-ups","Feküdj a hátadra, majd egyszerre emeld a törzsedet és az egyik nyújtott lábadat. Érintsd meg a lábfejedet, majd válts oldalt."],["V-ups","Emeld egyszerre a törzsedet és mindkét lábadat, nyújtott karral közelíts a bokádhoz vagy a lábfejedhez, majd kontrolláltan engedd vissza magad."]]},
{id:"run-snatch-vup",title:"Run · Snatch · V-ups intervallum",subtitle:"Intervallum blokk",category:"Intervallum",duration:"18:00 · 6 kör",rpe:"8.5–9/10",target:"Körönként 0:30–0:45 maradjon a V-upokra",format:"Every 3:00 × 6",
 blocks:[{title:"Minden új kör 3 percenként indul",items:["200 m futás","20 Alternating Dumbbell Snatch (váltott karos súlyzós szakítás)","A fennmaradó időben: max. ismétlés V-ups"],note:"Futás helyett: 1:00 Single Unders vagy 10 × 7,5 m ingafutás."}],

 tips:[["200 m futás / skálázás","Válassz olyan tempót, amely után azonnal át tudsz állni a súlyzós munkára. Ha nem tudsz futni, végezz 1 perc Single Unders-t vagy 10 × 7,5 m ingafutást."],["Alternating Dumbbell Snatch","A súlyzót a lábad közül indítsd, és a láb-csípő robbanékony kinyújtásával juttasd fej fölé; ne kizárólag a karoddal húzd. A kézcseréket tartsd gyorsnak és kontrolláltnak."],["V-ups","A 20. szakítás után azonnal feküdj le, és használd ki a maradék 30–45 másodpercet. Végezz gyors, de szabályos ismétléseket a következő kör kezdetéig."]]},
{id:"upper-strict-amrap",title:"Upper Body Strict AMRAP",subtitle:"Felsőtest metcon",category:"Felsőtest",duration:"12:00",rpe:"8.5–9/10",target:"Cél: kb. 3.5–4.5 kör",format:"AMRAP 12:00",
 blocks:[{title:"12 perces folyamatos körmunka",items:["8/8 Single Arm Dumbbell Floor Press","8/8 Single Arm Dumbbell Row","8/8 Single Arm Dumbbell Push Press","8 Strict Pull-ups (lendület nélkül)"]}],
 stimulus:"Felsőtesti izom-állóképesség és tiszta húzó-nyomó kapacitás. A nyomások és evezések felhalmozzák a fáradtságot, a strikt húzódzkodás pedig a tiszta erőkifejtést teszteli.",
 strategy:"Olyan kézi súlyzót válassz, amellyel a 8/8 ismétlések szabályosan, lehetőleg megállás nélkül mennek. A strikt húzódzkodást már az első körtől bontsd tudatosan, például 4+4 vagy 3+3+2 ismétlésre; ne várd meg, amíg teljesen elfáradsz.",
 tips:[["Single Arm Floor Press","Feküdj a hátadra, a könyököd minden ismétlésnél érintse a talajt, nagyjából 45 fokos szögben legyen a törzsedhez képest. Nyomd fel a súlyt kontrolláltan, teljes kinyújtásig."],["Single Arm Dumbbell Row","Tartsd feszesen a törzsedet, a hátad legyen közel párhuzamos a talajjal. Húzd a súlyzót a csípőd felé, ne a válladhoz."],["Single Arm Push Press","Kis térdhajlításból robbanj fel csípőből. Használd a láb- és csípőlökést, ne kizárólag a karodból nyomd fej fölé a súlyt."],["Strict Pull-ups","Lendület és rángatás nélkül dolgozz. Teljesen nyújtott karból indulj, és húzd az álladat a rúd fölé. Bontsd a szetteket gyors mikroszünetekkel, mielőtt szétesne a technika."]]},
{id:"weighted-chipper",title:"Weighted Chipper",subtitle:"Teljes testes metcon",category:"Chipper",duration:"Time cap 15:00",rpe:"9/10",target:"Irányidő: 10:30–12:30",format:"For time",
 blocks:[{title:"Teljesítsd sorrendben",items:["50 Push-ups (fekvőtámasz)","50 Goblet Squats (súlyzós guggolás)","50 Alternating Dumbbell Clean & Jerk","50 Weighted Front Rack Lunges (súlyzós kitörés vállon tartott súllyal)","50 Burpees"]}],
 stimulus:"Nagy ismétlésszámú, teljes testes chipper. A külső terhelés a lábat és a törzset fárasztja, miközben a mellkasra, vállra és légzésre is folyamatos nyomás kerül. A záró burpee a mentális állóképességet is próbára teszi.",

 tips:[["Push-ups","Tartsd feszesen a törzsedet, a könyöködet vezesd közel a testedhez. Ne menj izombukásig az elején."],["Goblet Squat","Tartsd a súlyzót a mellkasod előtt, a könyököd maradjon magasan. Guggolj kontrolláltan mélyre, majd állj fel határozottan."],["Alternating DB Clean & Jerk","A súlyzót a talajról indítsd, csípőből robbanj fel a válladhoz, majd láblökéssel juttasd fej fölé. Váltott karral haladj."],["Weighted Front Rack Lunges","Tartsd a súlyzót vagy súlyzókat a válladon. Lépj stabilan, a hátsó térded közelítsen a talajhoz, a törzsed maradjon függőleges."],["Burpees","Tarts egyenletes, fenntartható ritmust. Menj le kontrolláltan a talajra, állj fel, majd végezd el a feladatban előírt ugrást."]]},
{id:"three-part-metcon",title:"Three-Part Metcon",subtitle:"Háromrészes metcon",category:"Haladó metcon",duration:"3 blokk · blokk után 2:00 pihenő",rpe:"9/10",target:"Agresszív, de kontrollált körök",format:"3 blokk · mindegyikben 3 kör",
 blocks:[{title:"1. blokk – 3 kör",items:["8 Burpee Pull-ups","12 Box Jumps","16 Single Arm Dumbbell Hang Clean & Jerk (8/8)"],note:"A blokk után pihenj 2:00-t."},{title:"2. blokk – 3 kör",items:["4 Wall Walks","12 Burpees","16 Single Arm Dumbbell Thrusters (8/8)"],note:"A blokk után pihenj 2:00-t."},{title:"3. blokk – 3 kör",items:["6 Burpee Box Jump Overs","8 Toes-to-Bar","12 Single Arm Dumbbell Snatch (váltott kar)"],note:"A harmadik blokk végén fejezd be a munkát."}],

/* ============ ÁLLAPOT + MENTÉS ============ */
const baseState=()=>({programStart:DEFAULT_START,tm:{sq:null,bp:null,dl:null,ohp:null},runTimes:{t2:'',t5:''},logs:[],cycleApplied:null,tmHistory:[],runHistory:[],lastBackup:0});
const OLD_WORD=new RegExp('end'+'ure(\\s*track)?','gi'); // régi mentések szövegeinek átírása
const clean=t=>String(t??'').replace(OLD_WORD,'Metcon');
function sanitize(s,fromV2){
  const b=baseState();if(!s||typeof s!=='object'||Array.isArray(s))return b;
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(s.programStart||'')))b.programStart=s.programStart;
  for(const l of LIFTS){const n=Number(s.tm?.[l.key]);if(Number.isFinite(n)&&n>0)b.tm[l.key]=round25(n);}
  const r=s.runTimes||{},a=fromV2?r['2k']:r.t2,c=fromV2?r['5k']:r.t5;
  if(toSec(a)&&toSec(c)&&toSec(a)/2<toSec(c)/5){b.runTimes={t2:a,t5:c};}
  if(Array.isArray(s.logs))b.logs=s.logs.filter(x=>x&&typeof x==='object'&&x.id&&/^\d{4}-\d{2}-\d{2}$/.test(String(x.date))).map(x=>{
    let type=clean(x.type);if(/^metcon$/i.test(type))type='Metcon';const title=clean(x.title);
    let part=x.part;
    if(!part){part=type==='Wendler 5/3/1'?'wendler':(x.workoutId||false)?'metcon':(type==='Futás'&&RUNS.some(q=>q.title===title))?'run':'custom';}
    return {id:String(x.id),date:x.date,part,type,title,details:clean(x.details),createdAt:Number(x.createdAt)||0,amrapKg:Number(x.amrapKg)||0,amrapReps:Number(x.amrapReps)||0,lift:x.lift||''};
  });
  if(Array.isArray(s.tmHistory))b.tmHistory=s.tmHistory.filter(h=>h&&h.tm&&h.date);
  if(Array.isArray(s.runHistory))b.runHistory=s.runHistory.filter(h=>h&&h.date&&h.t2&&h.t5);
  b.cycleApplied=Number.isInteger(s.cycleApplied)&&s.cycleApplied>0?s.cycleApplied:null;
  b.lastBackup=Number(s.lastBackup)||0;
  return b;
}
function load(){
  try{
    const v3=localStorage.getItem(KEY);if(v3)return sanitize(JSON.parse(v3),false);
    const v2=localStorage.getItem(OLD_KEY);if(v2)return sanitize(JSON.parse(v2),true);
  }catch(e){console.warn(e)}
  return baseState();
}
let state=load(),tab='program',selectedDate='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('A böngésző nem engedte a mentést.',true)}}
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hidden'),2800)}

/* ============ PROGRAM MOTOR ============ */
const dayIndex=date=>{const[y,m,d]=date.split('-').map(Number),[a,b,c]=state.programStart.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(a,b-1,c))/864e5)};
function planFor(date){
  const i=dayIndex(date);if(i<0)return{kind:'before'};
  if(i%2===0){const n=i/2;return{kind:'strength',lift:ROT[n%4],week:Math.floor(n/4)%4+1,metcon:METCONS[n%METCONS.length],parts:['wendler','metcon']}}
  const n=(i-1)/2;return{kind:'run',run:RUNS[n%RUNS.length],parts:['run']};
}
const cycleNow=()=>{const i=dayIndex(today());return i<0?1:Math.floor(i/32)+1};
const logsOn=d=>state.logs.filter(l=>l.date===d);
const partLog=(d,p)=>state.logs.find(l=>l.date===d&&l.part===p);
const dayState=d=>{const p=planFor(d);if(p.kind==='before')return 'none';const n=p.parts.filter(x=>partLog(d,x)).length;return n===0?'todo':n===p.parts.length?'done':'part'};
const sets=(key,week)=>SCHEMES[week].map(([pct,reps])=>({pct,reps,kg:state.tm[key]?round25(state.tm[key]*pct):null}));
function runProfile(){
  const t2=toSec(state.runTimes.t2),t5=toSec(state.runTimes.t5);
  if(!t2||!t5||t2/2>=t5/5)return null;
  return{t2,t5,p2:t2/2,p5:t5/5};
}
const rng=(z,P)=>{const[a,b]=ZONES[z].range(P);return`${fmtPace(a)}–${fmtPace(b)} /km`};
function runTarget(run,P){
  if(!P)return null;
  const[a,b]=ZONES[run.zone].range(P);
  switch(run.zone){
   case'interval':return`${fmtPace(a*.4)}–${fmtPace(b*.4)} / 400 m (${rng('interval',P)})`;
   case'tempo':return`${rng('tempo',P)} · RPE 7/10`;
   case'progression':return`középső 2 km: ${rng('progression',P)}; a két szélső szakasz könnyű`;
   case'strides':return`${rng('strides',P)}; a fokozók csak lazák és technikásak`;
   case'recovery':return`${rng('recovery',P)} · nagyon könnyű`;
   default:return`${rng('easy',P)} · a pulzus/beszédteszt az elsődleges`;
  }
}

        ${has?`<div style="display:grid;gap:9px">${ss.map((s,k)=>`<div class="setrow"><div><span>${k+1}. munkasorozat · ${Math.round(s.pct*100)}% TM</span><br><b>${kgFmt(s.kg)} kg × ${s.reps}</b></div></div>`).join('')}</div>
          ${p.week<4?`<div class="tip"><h4>Bemelegítés</h4><p>${WARMUP.map(([pc,r])=>`${kgFmt(round25(state.tm[key]*pc))} kg × ${r}`).join(' · ')}</p></div>`:`<div class="tip"><h4>Deload hét</h4><p>Nincs AMRAP, a sorozatok könnyűek: a cél a regeneráció és a technika.</p></div>`}`
        :`<div class="notice"><h4>Add meg a Training Maxot</h4><p>A súlyok a saját TM-edből számolódnak. A Profil fülön add meg a ${LIFT[key].name.toLowerCase()} TM-et.</p><button class="btn pri" data-a="tab" data-t="profile">Profil megnyitása</button></div>`}
        <details><summary>▸ Tippek és kiegészítő munka</summary><div style="display:grid;gap:8px"><div class="tip"><h4>Technika</h4><p>${esc(p.lift.tip)}</p></div><div class="tip"><h4>Kiegészítő munka</h4><p>${esc(p.lift.accessory)}</p></div><p class="tiny dim">Az AMRAP (+) sorozatban hagyj 1–2 szabályos ismétlést tartalékban; ne menj technikai bukásig.</p></div></details>
        ${partLog(date,'wendler')?loggedBox(date,'wendler'):`${p.week<4&&has?`<div><label class="lbl">AMRAP ismétlések (opcionális)</label><input class="field" id="amrap" type="number" inputmode="numeric" min="0" max="40" placeholder="pl. 8"></div>`:''}${resultBox('wendler','Megjegyzés, használt súlyok, érzés…')}<button class="btn pri" data-a="logPart" data-p="wendler">Wendler edzés naplózása</button>`}
      </section>
      <section class="card">
        <div class="tags"><span class="tag">Metcon</span><span class="tag">${esc(w.duration)}</span></div>
        <h3>${esc(w.title)}</h3><p class="small mut">${esc(w.format)} · RPE ${esc(w.rpe)}</p>

      </section>`;
    }else{
      const r=p.run,P=runProfile(),tg=runTarget(r,P);
      body+=`<section class="card">
        <div class="tags"><span class="tag">Futás</span><span class="tag">${esc(r.dist)}</span></div><h3>${esc(r.title)}</h3>
        ${P?`<div class="notice sky"><h4>Személyre szabott céltempó</h4><p style="font-size:15px;font-weight:900;color:#fff">${esc(tg)}</p></div>`
          :`<div class="notice"><h4>Céltempó még nincs</h4><p>Add meg a legjobb 2 km-es és 5 km-es időd a Profil fülön, és ide kerül a személyes tempód.</p><button class="btn pri" data-a="tab" data-t="profile">Futóidők megadása</button></div>`}
        ${r.steps.map(([a,b])=>`<div class="step"><b>${a}</b><p class="small" style="color:#d4d4d8">${esc(b)}</p></div>`).join('')}
        <div class="tip"><h4>Tempóbeosztási tipp</h4><p>${esc(r.tip)}</p></div>
        ${partLog(date,'run')?loggedBox(date,'run'):`${resultBox('run','Táv, idő, átlagpulzus, érzés…')}<button class="btn pri" data-a="logPart" data-p="run">Futóedzés naplózása</button>`}
      </section>`;
    }
    const extra=logsOn(date).filter(l=>!p.parts.includes(l.part));
    if(extra.length)body+=`<section class="card"><div class="h">További naplózott edzések ezen a napon</div>${extra.map(logCard).join('')}</section>`;
  }
  return`<div class="strip">${strip}</div><div class="row"><div><div class="h em">${esc(fmtDate(date))}</div><h2>${esc(name)}</h2></div><button class="btn sm" data-a="jumpToday">Ma</button></div>${body}`;
}

function logCard(l){return`<article class="log"><div class="row" style="align-items:flex-start"><div style="min-width:0"><div class="h em">${esc(l.type)} · ${esc(fmtDate(l.date))}</div><b style="word-break:break-word">${esc(l.title)}</b></div><div style="display:flex;flex-shrink:0"><button class="icon" data-a="editLog" data-id="${esc(l.id)}" aria-label="Szerkesztés">✏️</button><button class="icon" data-a="delLog" data-id="${esc(l.id)}" aria-label="Törlés">🗑️</button></div></div>${l.details?`<pre>${esc(l.details)}</pre>`:''}</article>`}
function vLog(){
  const logs=[...state.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const month=today().slice(0,7),doneDays=new Set(state.logs.map(l=>l.date)).size;
  const est=k=>{const a=state.logs.filter(l=>l.lift===k&&l.amrapKg&&l.amrapReps).sort((x,y)=>x.createdAt-y.createdAt);return a.length?Math.round(a[a.length-1].amrapKg*(1+a[a.length-1].amrapReps/30)):null};
  const first=k=>{const h=state.tmHistory[0];return h&&h.tm[k]?h.tm[k]:null};
  const rows=LIFTS.filter(l=>state.tm[l.key]).map(l=>{const f=first(l.key),d=f?state.tm[l.key]-f:0,e=est(l.key);return`<div class="setrow"><div><b style="font-size:13px">${l.name}</b><br><span>TM ${kgFmt(state.tm[l.key])} kg${f&&d?` (${d>0?'+':''}${kgFmt(d)} kg a kezdés óta)`:''}</span></div><span>${e?'becsült 1RM: '+e+' kg':''}</span></div>`}).join('');
  const rh=state.runHistory,rf=rh[0],rl=rh[rh.length-1];
  const runRow=rl?`<div class="setrow"><div><b style="font-size:13px">Futóidők</b><br><span>2 km ${esc(rl.t2)} · 5 km ${esc(rl.t5)}${rh.length>1?` (kezdetben ${esc(rf.t2)} / ${esc(rf.t5)})`:''}</span></div></div>`:'';
  return`<section class="card"><div class="grid2" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b>${state.logs.length}</b><span>Edzés</span></div><div class="stat"><b>${state.logs.filter(l=>l.date.startsWith(month)).length}</b><span>E hónapban</span></div><div class="stat"><b>${doneDays}</b><span>Edzésnap</span></div></div>${rows||runRow?`<div class="h" style="margin-top:4px">Fejlődés</div>${rows}${runRow}`:''}</section>
  <button class="btn white" data-a="newLog">＋ Saját edzés rögzítése</button>
  <div class="row"><div class="h">Rögzített eredmények</div><span class="small dim">${logs.length} bejegyzés</span></div>
  ${logs.length?logs.map(logCard).join(''):'<div class="card small mut" style="text-align:center">Még nincs mentett edzés. A napi tervben naplózhatod a tervezett edzéseket, vagy rögzíthetsz sajátot.</div>'}`;
}

function addLog(o){state.logs.push({id:uid(),createdAt:Date.now(),amrapKg:0,amrapReps:0,lift:'',details:'',...o});save()}
function exportJSON(){return JSON.stringify({app:'strng-training',v:3,exported:new Date().toISOString(),state},null,1)}
async function restoreFrom(text){
  let o;try{o=JSON.parse(text)}catch(e){return toast('Ez nem érvényes mentés.',true)}
  if(!o||o.app!=='strng-training'||!o.state)return toast('Ez nem STRNG Training mentés.',true);
  if(!await ask('Visszaállítás','A mostani adataid felülíródnak a mentés tartalmával. Folytatod?','Visszaállítás'))return;
  state=sanitize(o.state,false);state.lastBackup=Date.now();save();closeModal();selectedDate=clampDate(today());render();toast('Adatok visszaállítva.');
}
const clampDate=d=>d<state.programStart?state.programStart:d;
const A={
 tab(d){tab=d.t;closeModal();render();window.scrollTo(0,0)},
 date(d){selectedDate=d.d;render()},
 jumpToday(){selectedDate=clampDate(today());render()},
 jumpStart(){selectedDate=state.programStart;render()},
 closeModal,
 askYes(){const r=askRes;askRes=null;closeModal();r&&r(true)},
 askNo(){const r=askRes;askRes=null;closeModal();r&&r(false)},
 openMetcon(d){openMetcon(d.id)},
 logLibrary(d){const w=METCONS.find(x=>x.id===d.id),note=($('#mres')?.value||'').trim();
   addLog({date:selectedDate,part:'metcon',refId:w.id,type:'Metcon',title:w.title,details:`${w.format} · ${w.duration}\n${w.blocks.map(b=>b.title+'\n'+b.items.map(i=>'• '+i).join('\n')).join('\n')}${note?'\n\nEredmény: '+note:''}`});
   closeModal();tab='program';render();toast('Metcon elmentve a naplóba.')},
 logPart(d){
   const date=selectedDate,p=planFor(date),note=($('#res-'+d.p)?.value||'').trim();
   if(d.p==='wendler'){const key=p.lift.key,ss=sets(key,p.week),reps=Number($('#amrap')?.value)||0,top=ss[2];
     const amrap=reps>0&&top.kg?`\nAMRAP: ${kgFmt(top.kg)} kg × ${reps} → becsült 1RM ${Math.round(top.kg*(1+reps/30))} kg`:'';
     addLog({date,part:'wendler',type:'Wendler 5/3/1',title:`Wendler ${LIFT[key].name}`,lift:key,amrapKg:reps>0&&top.kg?top.kg:0,amrapReps:reps>0?reps:0,
       details:`${p.week}. hét · TM: ${state.tm[key]?kgFmt(state.tm[key])+' kg':'nincs megadva'}\n${ss.map((s,k)=>`${k+1}. sorozat: ${Math.round(s.pct*100)}% = ${s.kg?kgFmt(s.kg)+' kg':'–'} × ${s.reps}`).join('\n')}${amrap}${note?'\n\nMegjegyzés: '+note:''}`});toast('Wendler edzés elmentve.')}
   else if(d.p==='metcon'){const w=p.metcon;addLog({date,part:'metcon',refId:w.id,type:'Metcon',title:w.title,details:`${w.format} · ${w.duration}${note?'\n\nEredmény: '+note:''}`});toast('Metcon elmentve.')}
   else{const r=p.run,P=runProfile(),tg=runTarget(r,P);addLog({date,part:'run',type:'Futás',title:r.title,details:`${r.dist}${tg?'\nCéltempó: '+tg:''}${note?'\n\nEredmény: '+note:''}`});toast('Futóedzés elmentve.')}
   render()},
 editLog(d){const l=state.logs.find(x=>x.id===d.id);if(l)logForm(l)},
 newLog(){logForm(null)},
 saveLogForm(d){
   const date=$('#f-date').value,title=$('#f-title').value.trim(),type=$('#f-type').value,details=$('#f-details').value.trim();
   if(!date)return toast('Válassz dátumot!',true);if(!title)return toast('Add meg az edzés nevét!',true);
   if(d.id){const l=state.logs.find(x=>x.id===d.id);if(l)Object.assign(l,{date,title,type,details});save();toast('Bejegyzés frissítve.')}
   else{addLog({date,part:'custom',type,title,details});toast('Edzés elmentve.')}
   closeModal();render()},
 async delLog(d){const l=state.logs.find(x=>x.id===d.id);if(!l)return;if(!await ask('Bejegyzés törlése',l.title,'Törlés'))return;state.logs=state.logs.filter(x=>x.id!==d.id);save();render();toast('Bejegyzés törölve.')},
 saveStart(){const v=$('#pstart').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return toast('Válassz érvényes dátumot!',true);state.programStart=v;state.cycleApplied=cycleNow();save();selectedDate=clampDate(today());render();toast('Program kezdete mentve.')},
 saveTm(){
   const nv={};for(const l of LIFTS){const v=$('#tm-'+l.key).value.trim(),n=Number(v);if(v!==''&&(!Number.isFinite(n)||n<=0))return toast(`${l.name}: pozitív súlyt adj meg!`,true);nv[l.key]=v===''?null:round25(n)}
   const changed=LIFTS.some(l=>nv[l.key]!==state.tm[l.key]);state.tm=nv;
   if(changed&&LIFTS.every(l=>nv[l.key])||(changed&&state.tmHistory.length===0&&LIFTS.some(l=>nv[l.key])))state.tmHistory.push({date:today(),tm:{...nv}});
   if(state.cycleApplied==null)state.cycleApplied=cycleNow();
   save();render();toast('Training Max elmentve.')},
 applyCycle(){const ups=cycleNow()-(state.cycleApplied||cycleNow());if(ups<=0)return;
   for(const l of LIFTS)state.tm[l.key]=round25(state.tm[l.key]+ups*(l.upper?2.5:5));
   state.cycleApplied=cycleNow();state.tmHistory.push({date:today(),tm:{...state.tm}});save();render();toast(`Elindult a ${cycleNow()}. ciklus: TM frissítve.`)},
 saveRun(){
   const a=normalizeTime($('#rt2').value),b=normalizeTime($('#rt5').value);$('#rt2').value=a;$('#rt5').value=b;
   if(!a||!b)return toast('Mindkét idő szükséges: 2 km ÉS 5 km.',true);
   const p=toSec(a),q=toSec(b);if(p==null||q==null)return toast('Az idő formátuma MM:SS legyen (másodperc max. 59).',true);
   if(p<240||p>1800||q<600||q>4500)return toast('Ellenőrizd az időket: 2 km 04:00–30:00, 5 km 10:00–75:00.',true);
   if(p/2>=q/5)return toast('A 2 km-es átlagtempónak gyorsabbnak kell lennie az 5 km-esnél.',true);
   state.runTimes={t2:a,t5:b};const h=state.runHistory[state.runHistory.length-1];if(!h||h.t2!==a||h.t5!==b)state.runHistory.push({date:today(),t2:a,t5:b});
   save();render();toast('Futótempók frissítve a napi tervben is.')},
 async share(){const json=exportJSON(),name=`strng-training-${today()}.json`;
   try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'STRNG mentés'});state.lastBackup=Date.now();save();render();return toast('Mentés kész!')}}catch(e){if(e&&e.name==='AbortError')return}
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();state.lastBackup=Date.now();save();render();toast('Fájl letöltve.')},
 async copy(){try{await navigator.clipboard.writeText(exportJSON());state.lastBackup=Date.now();save();render();toast('Vágólapra másolva, illeszd be egy jegyzetbe!')}catch(e){toast('A másolás nem sikerült, használd a fájlmentést.',true)}},
 restoreText(){restoreFrom($('#restoreText').value)},
 async wipe(){if(!await ask('Minden adat törlése','Az összes napló, TM és futóidő törlődik ezen az eszközön. Csak mentésből állítható vissza.','Törlés'))return;localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);state=baseState();selectedDate=clampDate(today());render();toast('Adatok törölve.')}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'&&askRes==null){closeModal();return}
  const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset,el);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rt2'||t.id==='rt5'){const v=liveTime(t.value);if(t.value!==v){t.value=v;try{t.setSelectionRange(v.length,v.length)}catch(_){}}}
  const m=/^orm-(\w+)$/.exec(t.id||'');if(m){const n=Number(t.value),tm=$('#tm-'+m[1]);if(tm)tm.value=n>0?round25(n*.9):''}
});
document.addEventListener('focusout',e=>{const t=e.target;if(t.id==='rt2'||t.id==='rt5')t.value=normalizeTime(t.value)});
document.addEventListener('change',e=>{if(e.target.id==='restoreFile'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.readAsText(f);e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')&&askRes==null)closeModal()});

selectedDate=clampDate(today());
if(state.cycleApplied==null)state.cycleApplied=cycleNow();
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
