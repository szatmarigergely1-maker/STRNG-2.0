<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STRNG Training</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;--card:#121214;--card-sub:#1a1a1e;
  --line:rgba(255,255,255,0.08);--line-strong:rgba(255,255,255,0.18);
  --text:#fff;--mut:#a1a1aa;--dim:#71717a;
  --em:#30d158;--em-bg:rgba(48,209,88,0.12);
  --sky:#0a84ff;--sky-bg:rgba(10,132,255,0.12);
  --amb:#ff9f0a;--amb-bg:rgba(255,159,10,0.12);
  --red:#ff453a;--red-bg:rgba(255,69,58,0.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:14px;line-height:1.45}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* Header */
.top{
  position:sticky;top:0;z-index:30;
  background:rgba(0,0,0,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:20px;font-weight:900;letter-spacing:-0.03em}
.brand span{font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--mut);border-left:1px solid var(--line);padding-left:8px}
.pill{font-size:11px;font-weight:800;color:var(--em);background:var(--em-bg);border:1px solid rgba(48,209,88,0.25);border-radius:999px;padding:4px 10px}

/* Layout */
.wrap{max-width:540px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Typo & Tags */
.h{font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--mut)}
.h.em{color:var(--em)}.h.sky{color:var(--sky)}.h.amb{color:var(--amb)}
h2{font-size:19px;font-weight:800}h3{font-size:16px;font-weight:800}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12.5px}.tiny{font-size:10.5px}
.mono{font-family:ui-monospace,Menlo,monospace}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card-sub);color:var(--mut);border-radius:999px;padding:4px 9px;font-size:10px;font-weight:800;text-transform:uppercase}
.tag.em{color:var(--em);border-color:rgba(48,209,88,0.25);background:var(--em-bg)}
.tag.sky{color:var(--sky);border-color:rgba(10,132,255,0.25);background:var(--sky-bg)}
.tag.amb{color:var(--amb);border-color:rgba(255,159,10,0.25);background:var(--amb-bg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* Buttons & Inputs */
.btn{width:100%;border:1px solid var(--line);background:var(--card-sub);border-radius:14px;padding:12px 14px;font-weight:800;font-size:12px;text-transform:uppercase;text-align:center}
.btn:active{transform:scale(0.97)}
.btn.pri{background:var(--em);color:#000;border-color:var(--em);font-weight:900}
.btn.sky{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:900}
.btn.white{background:#fff;color:#000;border-color:#fff;font-weight:900}
.btn.sm{width:auto;padding:6px 12px;font-size:11px;border-radius:10px}
.btn.danger{color:var(--red);border-color:rgba(255,69,58,0.2);background:var(--red-bg)}
.field{width:100%;background:var(--card-sub);border:1px solid var(--line);border-radius:14px;padding:12px;color:#fff;font:inherit;font-size:15px;outline:none}
.field:focus{border-color:var(--em)}
textarea.field{resize:vertical;min-height:68px}
.time{text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:800}
.lbl{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--dim);margin-bottom:4px}

/* Notice box */
.notice{border:1px solid rgba(255,159,10,0.25);background:var(--amb-bg);border-radius:15px;padding:12px;display:grid;gap:6px}
.notice h4{font-size:12px;font-weight:800;color:#fcd34d}
.notice p{font-size:12px;color:#e4e4e7}
.notice.sky{border-color:rgba(10,132,255,0.25);background:var(--sky-bg)}.notice.sky h4{color:#7dd3fc}
.notice.em{border-color:rgba(48,209,88,0.25);background:var(--em-bg)}.notice.em h4{color:#86efac}

/* Vízszintes naptár */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{min-width:58px;padding:8px 6px;border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:center;flex:0 0 auto}
.day small{display:block;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--dim)}
.day strong{display:block;font-size:16px;font-weight:900}
.day em{display:block;font-style:normal;font-size:8px;font-weight:900;color:var(--dim)}
.day.on{background:#fff;border-color:#fff;color:#000}
.day.on small,.day.on em{color:#000}

/* Elemek & Timer */
.setrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.setrow:last-child{border:0}
.item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.item:last-child{border:0}
.item i{font-style:normal;font-weight:900;color:var(--em)}
.timerbox{border:1px solid var(--line-strong);background:#070709;border-radius:18px;padding:14px;display:grid;gap:10px}
.timerdisplay{font:900 44px/1 ui-monospace,Menlo,monospace;text-align:center}

/* Bottom Nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(10,10,12,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
nav button{border-radius:12px;padding:6px 2px;color:var(--dim);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:18px;line-height:1}
nav button.on{color:#fff;background:rgba(255,255,255,0.08)}

/* Modal & Toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.panel{max-width:500px;margin:0 auto;background:var(--card);border:1px solid var(--line-strong);border-radius:22px;padding:18px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(85px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#fff;color:#000;padding:9px 18px;border-radius:999px;font-size:12px;font-weight:800;text-align:center}
.toast.err{background:var(--red);color:#fff}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>STRNG</b><span id="title">Mai terv</span></div>
  <div class="pill" id="badge">1. CIKLUS</div>
</header>

<main id="view" class="wrap"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
(()=>{'use strict';

// 1. ZOMBI CACHE MEGSEMMISÍTŐ
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => { for(let r of rs) r.unregister(); });
}
if ('caches' in window) {
  caches.keys().then(ks => { for(let k of ks) caches.delete(k); });
}

const KEY='strng_v4_store';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const pd=s=>new Date(s+'T12:00:00');
const fmtDate=s=>pd(s).toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'});
const uid=()=>(Date.now()+'-'+Math.random().toString(16).slice(2));
const kgFmt=n=>String(n).replace('.',',');
const round25=n=>Math.round(n/2.5)*2.5;

function liveTime(raw){
  const idx=raw.search(/\D/),all=raw.replace(/\D/g,'').slice(0,4);
  if(idx>=0){
    const m=raw.slice(0,idx).replace(/\D/g,''),s=raw.slice(idx).replace(/\D/g,'');
    if(m.length>=1&&m.length<=2&&s.length<=2)return m+':'+s;
  }
  if(all.length<=2)return all;
  if(all.length===3)return all[0]+':'+all.slice(1);
  return all.slice(0,2)+':'+all.slice(2);
}
function normalizeTime(raw){
  raw=String(raw||'').trim();if(!raw)return '';
  const idx=raw.search(/\D/);let m,s;
  if(idx>=0){m=raw.slice(0,idx).replace(/\D/g,'');s=raw.slice(idx).replace(/\D/g,'');}
  else{const d=raw.slice(0,4);if(d.length<=2){m=d;s='';}else if(d.length===3){m=d[0];s=d.slice(1);}else{m=d.slice(0,2);s=d.slice(2);}}
  return m===''?raw:pad(+m)+':'+pad(+(s||0));
}
const toSec=t=>{const m=/^(\d{1,2}):([0-5]\d)$/.exec(String(t||'').trim());return m?(+m[1])*60+(+m[2]):null};
const fmtPace=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${pad(s%60)}`};

/* ERŐEMELŐ FORGÓ */
const LIFTS=[
  {key:'sq',name:'Guggolás (Squat)',upper:false},
  {key:'bp',name:'Fekvenyomás (Bench)',upper:true},
  {key:'dl',name:'Felhúzás (Deadlift)',upper:false},
  {key:'ohp',name:'Mellből nyomás (OHP)',upper:true}
];
const LIFT=Object.fromEntries(LIFTS.map(l=>[l.key,l]));
const ROT=[
 {key:'bp',short:'BENCH',accessory:'DB egykezes evezés 3×10/oldal, 3×10 fekvőtámasz.',tip:'Zárd a lapockáidat a padon, a talpad stabilan támasszon. Engedd a rudat a szegycsonthoz, majd robbants fel.'},
 {key:'sq',short:'SQUAT',accessory:'TRX evezés 3×12, saját testsúlyos kitörés 3×8/oldal.',tip:'Mély hasi levegővétel (bracing), a törzs kőkemény, testsúly a teljes talpon. Fájdalommentes mélységbe guggolj.'},
 {key:'ohp',short:'OHP',accessory:'TRX evezés 3×12, oldalsó plank 3×30 mp/oldal.',tip:'Szorítsd a farizmot és a hasat, ne homoríts a derékkal. Függőleges vonalban nyomd a rudat.'},
 {key:'dl',short:'DEADLIFT',accessory:'Goblet squat 3×10, dead bug 3×10/oldal.',tip:'A rúd végig a testedhez közel marad. A talaj eltolásával állj fel, ne derékból rántsd meg.'}
];
const SCHEMES={1:[[.65,'5'],[.75,'5'],[.85,'5+']],2:[[.70,'3'],[.80,'3'],[.90,'3+']],3:[[.75,'5'],[.85,'3'],[.95,'1+']],4:[[.40,'5'],[.50,'5'],[.60,'5']]};
const WARMUP=[[.40,5],[.50,5],[.60,3]];

/* 15 KONDÍCIÓS EDZÉS (METCON) */
const METCONS=[
{id:"m1",title:"Engine Ladder",category:"Kondíció",duration:"Cap 20:00",target:"16:30 – 18:30",format:"5 kör időre",

{id:"m2",title:"Echo Chipper",category:"Chipper",duration:"Cap 22:00",target:"17:00 – 19:30",format:"Időre (For Time)",

{id:"m3",title:"Tri-Erg Aerobic Capacity",category:"Kardió",duration:"34:00 (3 kör)",target:"28:00 – 31:00",format:"3 kör (2:00 pihenővel)",

{id:"m7",title:"The 40-Min Engine Test",category:"Kardió",duration:"40:00 AMRAP",target:"3 – 3.5 kör",format:"40 perc folyamatos AMRAP",

{id:"m8",title:"Dumbbell Power & Capacity",category:"Kondíció",duration:"Cap 20:00",target:"14:00 – 16:30",format:"5 kör (1:30 pihenővel)",
 items:["15 Cal Echo Bike","12 DB Felhúzás (2×22.5/15 kg)","9 DB Hang Power Clean","6 DB Push Press"],
 strategy:"A súlyzós komplexet (12+9+6) próbáld meg lerakás nélkül végigvinni.",

{id:"m9",title:"Rowing Pyramid & TTB",category:"Kondíció",duration:"Cap 22:00",target:"16:00 – 18:30",format:"Időre (For Time)",
 items:["250m Evezés + 10 TTB","500m Evezés + 15 TTB","750m Evezés + 20 TTB","500m Evezés + 15 TTB","250m Evezés + 10 TTB"],
 strategy:"A 750 m evezés az edzés közepe, ott tartsd fegyelmezetten a splitet.",
 tips:[["Toes to Bar","Kis szettekben dolgozz rövid pihenőkkel."]]},
{id:"m10",title:"Ski & Box Step-Over Interval",category:"Intervallum",duration:"20:00 (4 kör)",target:"75+ fellépés",format:"4 kör (3:00 munka / 2:00 pihenő)",
 items:["350 m SkiErg","Fennmaradó időben: Max DB Box Step-Over (2×15/10 kg)"],

{id:"m12",title:"Triple Threat Sprint",category:"Kardió",duration:"Cap 23:00",target:"17:30 – 20:00",format:"Időre (For Time)",

{id:"m15",title:"The Final Benchmark",category:"Kondíció",duration:"Cap 26:00",target:"20:00 – 23:30",format:"Időre (For Time)",
 items:["100 Double Unders","50 Cal Evezés","40 Wall Ball (9/6 kg)","30 Burpee","20 DB Hang Clean & Jerk (2×20/15 kg)","50 Cal Echo Bike"],
 strategy:"A 30 napos ciklus végső tesztje. Az utolsó bringára tegyél fel mindent.",
 tips:[["Wall Ball","Egyenletes nagy szettekben csináld."]]}
];

/* 15 FUTÓEDZÉS */
const RUNS=[
{zone:'interval',title:'Intervallum: 5 × 800 m',dist:'5 × 800 m',steps:[['Bemelegítés','1 km laza kocogás @E.'],['Fő rész','5 × 800 m @2k tempóban (2:00 séta pihenővel).'],['Levezetés','1 km laza levezetés @E.']],tip:'Tartsd a céltempót végig egyenletesen.'},
{zone:'tempo',title:'Tempófutás: 20 perc küszöb',dist:'20 perc @T',steps:[['Bemelegítés','1.5 km @E + 3 × 60 m repülő.'],['Fő rész','20 perc folyamatos küszöbfutás @T zónában.'],['Levezetés','1 km laza kocogás @E.']],tip:'A tempó nehéz, de stabilan bírnod kell 20 percen át.'},

{zone:'interval',title:'Intervallum: 6 × 800 m',dist:'6 × 800 m',steps:[['Bemelegítés','1.2 km laza kocogás.'],['Fő rész','6 × 800 m @2k tempóban (2:00 pihenővel).'],['Levezetés','800 m levezetés.']],tip:'A 4. és 5. résztávnál dől el a minőség.'},
{zone:'tempo',title:'Tempófutás: 25 perc',dist:'25 perc @T',steps:[['Bemelegítés','1.5 km @E.'],['Fő rész','25 perc folyamatos futás @T zónában.'],['Levezetés','1.5 km kocogás.']],tip:'Az első 15 percben tartsd vissza magad.'},
{zone:'easy',title:'Aerob bázis: 9 km Z2',dist:'9 km @E',steps:[['Bemelegítés','1 km laza futás.'],['Fő rész','8 km folyamatos Z2 futás @E zónában.'],['Levezetés','Séta levezetés.']],tip:'Egyenletes, könnyed léptek magas lépésszámmal.'},

/* ADATTÁROLÁS */
const baseState=()=>({programStart:today(),tm:{sq:120,bp:90,dl:150,ohp:60},runTimes:{t2:'08:30',t5:'24:00'},logs:[],cycleApplied:1});

function sanitize(s){
  const b=baseState();
  if(!s||typeof s!=='object')return b;
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(s.programStart||'')))b.programStart=s.programStart;
  for(const l of LIFTS){
    const n=Number(s.tm?.[l.key]);
    if(Number.isFinite(n)&&n>0)b.tm[l.key]=round25(n);
  }
  const r=s.runTimes||{};
  if(r.t2)b.runTimes.t2=r.t2;
  if(r.t5)b.runTimes.t5=r.t5;
  if(Array.isArray(s.logs))b.logs=s.logs.filter(x=>x&&x.id&&x.date);
  b.cycleApplied=Number.isInteger(s.cycleApplied)?s.cycleApplied:1;
  return b;
}

function load(){
  try{
    const v=localStorage.getItem(KEY);if(v)return sanitize(JSON.parse(v));
  }catch(e){}
  return baseState();
}

let state=load(),tab='program',selectedDate='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Mentési hiba!',true)}}
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hidden'),2400)}

/* PROGRAM LOGIKA */
const dayIndex=date=>{
  const[y,m,d]=date.split('-').map(Number),[a,b,c]=state.programStart.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,d)-Date.UTC(a,b-1,c))/864e5);
};

function planFor(date){
  const i=dayIndex(date);
  if(i<0)return{kind:'before',parts:[]};
  if(i%2===0){
    const n=i/2;
    return{kind:'strength',lift:ROT[n%4],week:Math.floor(n/4)%4+1,metcon:METCONS[n%METCONS.length],parts:['wendler','metcon']};
  }
  const n=(i-1)/2;
  return{kind:'run',run:RUNS[n%RUNS.length],parts:['run']};
}

const cycleNow=()=>{const i=dayIndex(today());return i<0?1:Math.floor(i/30)+1};
const logsOn=d=>state.logs.filter(l=>l.date===d);
const partLog=(d,p)=>state.logs.find(l=>l.date===d&&l.part===p);
const sets=(key,week)=>SCHEMES[week].map(([pct,reps])=>({pct,reps,kg:state.tm[key]?round25(state.tm[key]*pct):null}));

function runProfile(){
  const t2=toSec(state.runTimes.t2),t5=toSec(state.runTimes.t5);
  if(!t2||!t5||t2/2>=t5/5)return null;
  return{t2,t5,p2:t2/2,p5:t5/5};
}
const rng=(z,P)=>{const[a,b]=ZONES[z].range(P);return`${fmtPace(a)}–${fmtPace(b)} /km`};
function runTarget(run,P){
  if(!P)return null;
  const[a,b]=ZONES[run.zone].range(P);
  switch(run.zone){
   case'interval':return`Résztávok: ${fmtPace(P.p2)} /km (@2k) és ${fmtPace(P.p5)} /km (@5k)`;
   case'tempo':return`Küszöbtempó: ${rng('tempo',P)}`;
   case'progression':return`Középső szakasz: ${rng('progression',P)}`;
   default:return`Z2 alapozó: ${rng('easy',P)}`;
  }
}

/* METCON MODAL & TIMER */
let timerState={id:null,sec:900,running:false};
const timerFmt=n=>`${Math.floor(n/60)}:${pad(n%60)}`;

function timerTick(){
  const d=$('#timer-display');
  if(timerState.sec>0){
    timerState.sec--;
    if(d)d.textContent=timerFmt(timerState.sec);
  } else {
    clearInterval(timerState.id);
    timerState.running=false;
    const b=$('#timer-btn');if(b)b.textContent='Start';
    toast('Lejárt az idő!');
  }
}

const A={
 tab(d){tab=d.t;closeModal();render();window.scrollTo(0,0)},
 date(d){selectedDate=d.d;render()},
 jumpToday(){selectedDate=today();render()},
 jumpStart(){selectedDate=state.programStart;render()},
 closeModal,
 openMetcon(d){openMetcon(d.id)},
 toggleTimer(){
   const b=$('#timer-btn');
   if(timerState.running){
     clearInterval(timerState.id);
     timerState.running=false;
     if(b)b.textContent='Folytatás';
   } else {
     timerState.running=true;
     timerState.id=setInterval(timerTick,1000);
     if(b)b.textContent='Szünet';
   }
 },
 logLibrary(d){
   const w=METCONS.find(x=>x.id===d.id);if(!w)return;
   addLog({date:selectedDate,type:'Metcon',title:w.title,details:`${w.format} · ${w.duration}\n${w.items.join('\n')}`});
   closeModal();render();toast('Metcon elmentve!');
 },
 logPart(d){
   const date=selectedDate,p=planFor(date);
   if(d.p==='wendler'){
     const key=p.lift.key,ss=sets(key,p.week),reps=Number($('#amrap')?.value)||0,top=ss[2];
     const amrap=reps>0&&top.kg?`\nAMRAP: ${kgFmt(top.kg)} kg × ${reps} rep → Becsült 1RM: ${Math.round(top.kg*(1+reps/30))} kg`:'';
     addLog({date,type:'Súlyemelés',title:`5/3/1 ${LIFT[key].name}`,
       details:`${p.week}. hét · TM: ${kgFmt(state.tm[key])} kg\n${ss.map((s,k)=>`${k+1}. sorozat:${Math.round(s.pct*100)}% = ${kgFmt(s.kg)} kg × ${s.reps}`).join('\n')}${amrap}`});
     toast('Erőedzés mentve!');
   } else if(d.p==='metcon'){
     const w=p.metcon;
     addLog({date,type:'Metcon',title:w.title,details:`${w.format} · ${w.duration}\n${w.items.join('\n')}`});
     toast('Kondíció mentve!');
   } else {
     const r=p.run,P=runProfile(),tg=runTarget(r,P);
     addLog({date,type:'Futás',title:r.title,details:`${r.dist}${tg?'\nCéltempó: '+tg:''}`});
     toast('Futóedzés mentve!');
   }
   render();
 },
 delLog(d){
   if(!confirm('Törlöd ezt az edzést?'))return;
   state.logs=state.logs.filter(x=>x.id!==d.id);save();render();toast('Törölve.');
 },
 saveTm(){
   for(const l of LIFTS){
     const v=$('#tm-'+l.key).value.trim(),n=Number(v);
     state.tm[l.key]=v===''?null:round25(n);
   }
   save();render();toast('Súlyok mentve!');
 },
 applyCycle(){
   if(!confirm('Lépteted a ciklust? Felsőtest: +2.5kg, Alsótest: +5kg.'))return;
   for(const l of LIFTS)state.tm[l.key]=round25(state.tm[l.key]+(l.upper?2.5:5));
   state.cycleApplied=(state.cycleApplied||1)+1;
   save();render();toast(`${state.cycleApplied}. ciklus aktiválva!`);
 },
 saveRun(){
   const a=normalizeTime($('#rt2').value),b=normalizeTime($('#rt5').value);
   if(!a||!b)return toast('Add meg mindkét időt!',true);
   state.runTimes={t2:a,t5:b};save();render();toast('Futóidők mentve!');
 },
 share(){
   const json=JSON.stringify({app:'strng-training',state},null,2);
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
   a.download=`strng_mentes_${today()}.json`;a.click();toast('Fájl letöltve!');
 },
 wipe(){
   if(!confirm('FIGYELEM: Minden mentett adat törlődik. Folytatod?'))return;
   localStorage.clear();state=baseState();render();toast('Alaphelyzetbe állítva.');
 }
};

document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset,el);
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rt2'||t.id==='rt5'){const v=liveTime(t.value);if(t.value!==v)t.value=v;}
  if(t.id==='amrap'){
    const val=Number(t.value),p=planFor(selectedDate);
    if(val>0&&p.lift){
      const ss=sets(p.lift.key,p.week),top=ss[2];
      if(top.kg)$('#amrap-est').textContent=`Becsült 1RM: ${Math.round(top.kg*(1+val/30))} kg`;
    }else if($('#amrap-est')){$('#amrap-est').textContent='';}
  }
});

document.addEventListener('focusout',e=>{const t=e.target;if(t.id==='rt2'||t.id==='rt5')t.value=normalizeTime(t.value)});

selectedDate=today();
render();
})();
</script>
</body>
</html>
